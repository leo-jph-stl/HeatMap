name: Update Electricity Price

on:
  schedule:
    # Stündlich: die Day-Ahead-Preise selbst ändern sich nur ~1x täglich (Auktion für den
    # Folgetag löst meist gegen 13-14 Uhr MEZ aus), aber ein günstiger, keyfreier Abruf ohne
    # Rate-Limit-Sorgen erlaubt es, die Veröffentlichung zeitnah einzusammeln.
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "price-fetch"
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch Day-Ahead Electricity Price (aWATTar)
        run: node fetch_electricity_price.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add electricity_price.js electricity_price.json
          if git diff --staged --quiet; then
            echo 'No changes in price data.'
          else
            git commit -m 'chore(price): auto-update day-ahead electricity price [skip ci]'
            pushed=0
            for i in 1 2 3 4 5; do
              git fetch --depth=50 origin main
              if git rebase --autostash origin/main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ $pushed -eq 0 ]; then
              echo "Failed to push electricity price data after 5 attempts."
              exit 1
            fi
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-price
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
