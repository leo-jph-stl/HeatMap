name: Update GFS Weather Data

on:
  schedule:
    # Runs 4 times daily at 04:00, 10:00, 16:00, 22:00 UTC (~4h after NOAA GFS runs 00, 06, 12, 18 UTC)
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-gfs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest GFS 0.25deg Data
        run: node fetch_gfs_0p25.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add temp_data.js manifest.json
          if git diff --staged --quiet; then
            echo 'No changes in weather data.'
          else
            git commit -m 'chore(data): auto-update GFS 0.25deg weather data [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
