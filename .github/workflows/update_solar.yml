name: Update Solar Radiation Data

on:
  schedule:
    # Live-Zeitreihe: 4x täglich, 5 Minuten nach dem GFS-Wetter-Update versetzt
    # (beide teilen sich die "pages"-Concurrency-Gruppe und würden sich sonst gegenseitig abbrechen)
    - cron: '5 4,10,16,22 * * *'
    # Klimatologie (20-Jahres-Mittel) ändert sich praktisch nie - reicht wöchentlich
    - cron: '15 3 * * 0'
  workflow_dispatch: # Manueller Trigger über den Actions-Tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-solar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Live Solar Radiation Timeline (GFS 0.25°)
        run: node fetch_solar_timeline.js

      - name: Fetch Live Cloud Cover (für die Nachtseite der Einstrahlungskarte)
        run: node fetch_cloud_timeline.js

      - name: Fetch Solar Climatology (NASA POWER, wöchentlich oder manuell)
        if: github.event.schedule == '15 3 * * 0' || github.event_name == 'workflow_dispatch'
        run: node fetch_solar_climatology.js

      - name: Restore forecast.solar log from Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          code=$(curl -s -o forecast_solar_log.json -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/forecast_solar_log")
          if [ "$code" != "200" ]; then
            echo '[]' > forecast_solar_log.json
            echo "KV-Key 'forecast_solar_log' noch nicht vorhanden (HTTP $code) - starte mit Fallback."
          fi

      - name: Fetch forecast.solar Vergleichsprognose (unabhängige zweite Quelle)
        run: node fetch_forecast_solar.js

      - name: Save forecast.solar log to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -s -o /dev/null -w "KV-Put 'forecast_solar_log': HTTP %{http_code}\n" \
            -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @forecast_solar_log.json \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/forecast_solar_log"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add solar_data.js solar_climatology_data.js cloud_data.js
          git rm --ignore-unmatch forecast_solar_log.json
          if git diff --staged --quiet; then
            echo 'No changes in solar data.'
          else
            git commit -m 'chore(data): auto-update solar radiation and cloud cover data [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
