name: Weekly PV Forecast Calibration Review

on:
  schedule:
    # Jeden Montag 06:00 UTC = 08:00 Europe/Berlin (CEST)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore private state from Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          kv_get() {
            local key="$1" outfile="$2" fallback="$3"
            code=$(curl -s -o "$outfile" -w "%{http_code}" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/$key")
            if [ "$code" != "200" ]; then
              echo "$fallback" > "$outfile"
              echo "KV-Key '$key' noch nicht vorhanden (HTTP $code) - starte mit Fallback."
            fi
          }
          kv_get forecast_solar_log forecast_solar_log.json '[]'
          kv_get pv_forecast_log pv_forecast_log.json '[]'
          kv_get pv_calibration_history pv_calibration_history.json '[]'

      - name: Run calibration review
        run: node pv_calibration_review.js

      - name: Save calibration state to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          kv_put() {
            local key="$1" infile="$2" content_type="$3"
            if [ -f "$infile" ]; then
              curl -s -o /dev/null -w "KV-Put '$key': HTTP %{http_code}\n" \
                -X PUT \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: $content_type" \
                --data-binary @"$infile" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/$key"
            fi
          }
          kv_put pv_calibration_history pv_calibration_history.json application/json
          kv_put pv_calibration_report pv_calibration_report.md text/markdown
