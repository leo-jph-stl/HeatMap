name: Weekly PV Forecast Calibration Review

on:
  schedule:
    # Jeden Montag 06:00 UTC = 08:00 Europe/Berlin (CEST)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  calibration-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run calibration review
        run: node pv_calibration_review.js

      - name: Commit calibration history if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pv_calibration_history.json
          if git diff --staged --quiet; then
            echo 'No changes in calibration history.'
          else
            git commit -m "chore(pv-calibration): weekly review $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Post report as GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "pv-calibration" --color "FFDB00" --description "Wöchentlicher PV-Kalibrierungsbericht" 2>/dev/null || true
          gh issue create \
            --title "PV-Kalibrierung Wochenbericht $(date -u +%Y-%m-%d)" \
            --body-file pv_calibration_report.md \
            --label "pv-calibration"
