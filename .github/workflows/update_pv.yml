name: Update FoxESS PV Data

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'fetch_pv.py'
      - '.github/workflows/update_pv.yml'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Lade alle fehlenden historischen Stundendaten seit Mai 2025 vollständig nach'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pv-fetch"
  cancel-in-progress: false

jobs:
  update-pv:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          pip install foxesscloud urllib3 requests

      - name: Restore private state from Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          kv_get() {
            local key="$1" outfile="$2" fallback="$3"
            code=$(curl -s -o "$outfile" -w "%{http_code}" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/$key")
            if [ "$code" != "200" ]; then
              echo "$fallback" > "$outfile"
              echo "KV-Key '$key' noch nicht vorhanden (HTTP $code) - starte mit Fallback."
            fi
          }
          kv_get pv_data pv_data.json '{}'
          kv_get pv_forecast_log pv_forecast_log.json '[]'
          kv_get pv_daily_history pv_daily_history.json '{}'

      - name: Fetch Live FoxESS PV Data
        env:
          PV_BASE_KWP: ${{ vars.PV_BASE_KWP || '9.6' }}
          PV_EEG_RATE_CT: ${{ vars.PV_EEG_RATE_CT || '8.20' }}
          FOX_USERNAME: ${{ secrets.FOX_USERNAME }}
          FOX_PASSWORD: ${{ secrets.FOX_PASSWORD }}
          FOXESS_USERNAME: ${{ secrets.FOXESS_USERNAME }}
          FOXESS_PASSWORD: ${{ secrets.FOXESS_PASSWORD }}
          FOX_USER: ${{ secrets.FOX_USER }}
          FOX_PASS: ${{ secrets.FOX_PASS }}
          FOX_API_KEY: ${{ secrets.FOX_API_KEY }}
          FOXESS_API_KEY: ${{ secrets.FOXESS_API_KEY }}
          FOX_DEVICE_SN: ${{ secrets.FOX_DEVICE_SN }}
          FOXESS_DEVICE_SN: ${{ secrets.FOXESS_DEVICE_SN }}
          SEC_USERNAME: ${{ secrets.USERNAME }}
          SEC_PASSWORD: ${{ secrets.PASSWORD }}
          SEC_USER: ${{ secrets.USER }}
          SEC_PASS: ${{ secrets.PASS }}
          SEC_NUTZERNAME: ${{ secrets.NUTZERNAME }}
          SEC_BENUTZERNAME: ${{ secrets.BENUTZERNAME }}
          SEC_BENUTZER: ${{ secrets.BENUTZER }}
          SEC_NUTZER: ${{ secrets.NUTZER }}
          SEC_PASSWORT: ${{ secrets.PASSWORT }}
          SEC_KENNWORT: ${{ secrets.KENNWORT }}
          SEC_EMAIL: ${{ secrets.EMAIL }}
          SEC_MAIL: ${{ secrets.MAIL }}
          SEC_LOGIN: ${{ secrets.LOGIN }}
          SEC_FOX: ${{ secrets.FOX }}
          SEC_FOXESS: ${{ secrets.FOXESS }}
          VAR_FOX_USERNAME: ${{ vars.FOX_USERNAME }}
          VAR_FOX_PASSWORD: ${{ vars.FOX_PASSWORD }}
          VAR_FOXESS_USERNAME: ${{ vars.FOXESS_USERNAME }}
          VAR_FOXESS_PASSWORD: ${{ vars.FOXESS_PASSWORD }}
          VAR_FOX_USER: ${{ vars.FOX_USER }}
          VAR_FOX_PASS: ${{ vars.FOX_PASS }}
          VAR_FOX_API_KEY: ${{ vars.FOX_API_KEY }}
          VAR_FOXESS_API_KEY: ${{ vars.FOXESS_API_KEY }}
          VAR_FOX_DEVICE_SN: ${{ vars.FOX_DEVICE_SN }}
          VAR_USERNAME: ${{ vars.USERNAME }}
          VAR_PASSWORD: ${{ vars.PASSWORD }}
          VAR_NUTZERNAME: ${{ vars.NUTZERNAME }}
          VAR_BENUTZERNAME: ${{ vars.BENUTZERNAME }}
          VAR_PASSWORT: ${{ vars.PASSWORT }}
          FULL_BACKFILL: ${{ inputs.full_backfill || 'false' }}
        run: python fetch_pv.py

      - name: Log Ist-Leistung vs. Einstrahlungsprognose (für anlagenspezifische Kalibrierung)
        run: node log_pv_forecast.js

      - name: Save private state to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          kv_put() {
            local key="$1" infile="$2"
            if [ -f "$infile" ]; then
              curl -s -o /dev/null -w "KV-Put '$key': HTTP %{http_code}\n" \
                -X PUT \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @"$infile" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/$key"
            fi
          }
          kv_put pv_data pv_data.json
          kv_put pv_forecast_log pv_forecast_log.json
          kv_put pv_daily_history pv_daily_history.json

      - name: Build public (anonymized) PV production series
        run: node build_pv_public_series.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pv_public_series.json
          git rm --ignore-unmatch pv_data.json pv_data.js pv_forecast_log.json pv_daily_history.json
          if git diff --staged --quiet; then
            echo 'No changes in PV data.'
          else
            git commit -m 'chore(pv): auto-update public PV series [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-pv
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
