name: Update FoxESS PV Data

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-pv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install foxesscloud urllib3 requests

      - name: Fetch Live FoxESS PV Data
        env:
          FOX_USERNAME: ${{ secrets.FOX_USERNAME || secrets.FOXESS_USERNAME || secrets.FOX_USER || secrets.USERNAME }}
          FOX_PASSWORD: ${{ secrets.FOX_PASSWORD || secrets.FOXESS_PASSWORD || secrets.FOX_PASS || secrets.PASSWORD }}
          FOX_API_KEY: ${{ secrets.FOX_API_KEY || secrets.FOXESS_API_KEY || secrets.FOX_APIKEY || secrets.API_KEY }}
          FOX_DEVICE_SN: ${{ secrets.FOX_DEVICE_SN || secrets.FOXESS_DEVICE_SN || secrets.FOX_SN || secrets.DEVICE_SN }}
        run: python fetch_pv.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pv_data.json pv_data.js
          if git diff --staged --quiet; then
            echo 'No changes in PV data.'
          else
            git commit -m 'chore(pv): auto-update FoxESS solar data [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-pv
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
