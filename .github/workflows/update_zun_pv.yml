name: Update zun PV Data

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'fetch_zun_pv.py'
      - '.github/workflows/update_zun_pv.yml'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Vollständiger Backfill aller Tage mit Stundendaten'
        required: false
        type: boolean
        default: false
      batch_size:
        description: 'Anzahl Tage pro Durchlauf (Standard: 35)'
        required: false
        default: '35'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "zun-pv-fetch"
  cancel-in-progress: false

jobs:
  update-zun-pv:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore private state from Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          kv_get() {
            local key="$1" outfile="$2" fallback="$3"
            code=$(curl -s -o "$outfile" -w "%{http_code}" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/$key")
            if [ "$code" != "200" ]; then
              echo "$fallback" > "$outfile"
              echo "KV-Key '$key' noch nicht vorhanden (HTTP $code) - starte mit Fallback."
            fi
          }
          kv_get zun_pv_data zun_pv_data.json '{}'
          kv_get zun_daily_history zun_daily_history.json '{}'

      - name: Fetch Live zun PV Data
        env:
          ZUN_API_TOKEN: ${{ secrets.ZUN_API_TOKEN }}
          ZUN_TOKEN: ${{ secrets.ZUN_TOKEN }}
          SEC_ZUN_API_TOKEN: ${{ secrets.SEC_ZUN_API_TOKEN }}
          ZUN_INVERTER_ID: ${{ secrets.ZUN_INVERTER_ID || vars.ZUN_INVERTER_ID || '' }}
          ZUN_LAT: ${{ vars.ZUN_LAT || '50.045' }}
          ZUN_LNG: ${{ vars.ZUN_LNG || '8.436' }}
          ZUN_LOCATION_NAME: ${{ vars.ZUN_LOCATION_NAME || 'Weilbach (Flörsheim am Main)' }}
          FULL_BACKFILL: ${{ github.event.inputs.full_backfill || 'false' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '35' }}
        run: python fetch_zun_pv.py

      - name: Save private state to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          kv_put() {
            local key="$1" infile="$2"
            if [ -f "$infile" ]; then
              curl -s -o /dev/null -w "KV-Put '$key': HTTP %{http_code}\n" \
                -X PUT \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @"$infile" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/$key"
            fi
          }
          kv_put zun_pv_data zun_pv_data.json
          kv_put zun_daily_history zun_daily_history.json

      - name: Build public (anonymized) PV production series
        run: node build_zun_public_series.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add zun_public_series.json
          git rm --ignore-unmatch zun_pv_data.json zun_pv_data.js zun_daily_history.json
          if git diff --staged --quiet; then
            echo 'No changes in zun PV data.'
          else
            git commit -m 'chore(zun): auto-update public PV series [skip ci]'
            git pull --rebase origin main
            git push
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-zun-pv
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
