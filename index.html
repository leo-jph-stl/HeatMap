<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globale Wetterkarte</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    
    <script src="wind_data.js"></script>
    <script src="temp_data.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; overflow: hidden; }
        #canvas-container { position: absolute; top: 0; bottom: 0; width: 100%; }

        #ui-container {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.9); padding: 20px 40px; border-radius: 12px;
            text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.8); width: 80%;
            max-width: 700px; border: 1px solid rgba(255, 255, 255, 0.2); z-index: 10;
        }
        #timeLabel { font-size: 1.4em; font-weight: bold; margin-bottom: 5px; color: #ffffff; }
        
        #layer-toggles { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        .toggle-btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .toggle-btn:hover { background: #444; }
        .toggle-btn.active { background: #00ccff; color: #000; border-color: #00ccff; box-shadow: 0 0 10px rgba(0, 204, 255, 0.5); }

        #legend { margin-top: 15px; display: flex; align-items: center; justify-content: space-between; font-size: 0.9em; font-weight: bold; }
        .color-bar { flex-grow: 1; height: 12px; margin: 0 15px; border-radius: 6px; box-shadow: 0 0 5px rgba(0,0,0,0.5) inset; }
        
        #timeline-container {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 8px;
            font-family: sans-serif; box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 10;
            width: 350px; text-align: center; color: black;
        }
        #timeSlider { width: 100%; margin: 10px 0; cursor: pointer; }
        #timeDisplayTitle { font-weight: bold; font-size: 14px; min-width: 120px; }
        .time-labels { display: flex; justify-content: space-between; font-size: 12px; }

        #popup {
            position: absolute;
            background: white;
            color: #333;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -100%);
            margin-top: -10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 20;
        }
        #popup::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        #screenWindCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        #cityLabelsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <canvas id="screenWindCanvas"></canvas>
    <canvas id="cityLabelsCanvas"></canvas>
    <div id="popup"></div>
    
    <div id="ui-container">
        <div id="timeLabel">Live Oberflächentemperatur (3D Globus)</div>
        <div style="font-size: 0.85em; color: #aaa; margin-top: 5px;">Reale interpolierte Wetterdaten</div>
        
        <div id="layer-toggles">
            <button id="btn-temp" class="toggle-btn active" onclick="switchLayer('temp')">Temperatur</button>
            <button id="btn-wind" class="toggle-btn" onclick="switchLayer('wind')">Windgeschwindigkeit</button>
        </div>

        <div id="legend">
            <span id="legend-min">-30°C</span>
            <div id="legend-bar" class="color-bar" style="background: linear-gradient(to right, #8c52ff, #a473b6, #b388ff, #88ccee, #3399cc, #1d5cae, #1b7a42, #32962a, #55ad26, #84c424, #b2d820, #d8e61e, #f7e318, #f8be17, #f69519, #eb6814, #e03e16, #dc2626, #b71c1c, #800808, #480202, #200000);"></div>
            <span id="legend-max">+50°C</span>
        </div>
    </div>
    
    <div id="timeline-container">
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 5px;">
            <button id="playBtn" style="padding: 2px 10px; font-size: 14px; border-radius: 4px;">▶ Play</button>
            <div id="timeDisplayTitle">Live (Jetzt)</div>
        </div>
        <input type="range" id="timeSlider" min="-24" max="48" step="3" value="0">
        <div class="time-labels">
            <span>-24h</span>
            <span>Live</span>
            <span>+48h</span>
        </div>
    </div>

    <script>
        // GLOBALS
        let currentMode = 'temp'; 
        let currentHourOffset = 0;
        let activeTemp = null;
        let activeWind = null;
        
        // INTERPOLATION DATA
        const colorScaleWind = d3.scaleLinear()
            .domain([0, 3, 7, 12, 17, 24, 30])
            .range(['#1a1a3a', '#0033cc', '#00ccff', '#00ff00', '#ffff00', '#ff6600', '#cc00ff'])
            .clamp(true);

        const colorScaleTemp = d3.scaleLinear()
            .domain([-60, -40, -30, -20, -15, -10, -5, 0, 3, 7, 11, 15, 17, 19, 20, 22, 24, 27, 30, 34, 39, 44, 49, 54])
            .range([
                '#ffffff', '#6010a0', '#8c52ff', '#a473b6', '#b388ff', '#88ccee', '#3399cc', '#1d5cae', 
                '#1b7a42', '#32962a', '#55ad26', '#84c424', '#b2d820', '#d8e61e', '#f7e318', '#f8be17', 
                '#f69519', '#eb6814', '#e03e16', '#dc2626', '#b71c1c', '#800808', '#480202', '#200000'
            ])
            .clamp(true);

        function getInterpolatedData(lat, lng) {
            let u=0, v=0, t=15;
            let lon0360 = lng < 0 ? lng + 360 : lng;
            
            if (activeWind) {
                const wh = activeWind.u.header;
                let y = (wh.la1 - lat) / wh.dy;
                let x = lon0360 / wh.dx;
                
                let y0 = Math.floor(y); let x0 = Math.floor(x);
                let y1 = y0 + 1; let x1 = x0 + 1;

                if (y0 < 0) y0 = 0; if (y0 >= wh.ny) y0 = wh.ny - 1;
                if (y1 < 0) y1 = 0; if (y1 >= wh.ny) y1 = wh.ny - 1;
                if (x0 < 0) x0 = 0; if (x0 >= wh.nx) x0 = wh.nx - 1;
                if (x1 < 0) x1 = 0; if (x1 >= wh.nx) x1 = wh.nx - 1;

                let dy = y - y0; let dx = x - x0;
                const i00 = y0 * wh.nx + x0; const i10 = y0 * wh.nx + x1;
                const i01 = y1 * wh.nx + x0; const i11 = y1 * wh.nx + x1;

                u = (activeWind.u.data[i00]||0)*(1-dx)*(1-dy) + (activeWind.u.data[i10]||0)*dx*(1-dy) + (activeWind.u.data[i01]||0)*(1-dx)*dy + (activeWind.u.data[i11]||0)*dx*dy;
                v = (activeWind.v.data[i00]||0)*(1-dx)*(1-dy) + (activeWind.v.data[i10]||0)*dx*(1-dy) + (activeWind.v.data[i01]||0)*(1-dx)*dy + (activeWind.v.data[i11]||0)*dx*dy;
            }

            if (activeTemp) {
                const th = activeTemp.header;
                let y = (th.la1 - lat) / th.dy;
                let x = lon0360 / th.dx;
                
                let y0 = Math.floor(y); let x0 = Math.floor(x);
                let y1 = y0 + 1; let x1 = x0 + 1;

                if (y0 < 0) y0 = 0; if (y0 >= th.ny) y0 = th.ny - 1;
                if (y1 < 0) y1 = 0; if (y1 >= th.ny) y1 = th.ny - 1;
                if (x0 < 0) x0 = 0; if (x0 >= th.nx) x0 = th.nx - 1;
                if (x1 < 0) x1 = 0; if (x1 >= th.nx) x1 = th.nx - 1;

                let dy = y - y0; let dx = x - x0;
                const i00 = y0 * th.nx + x0; const i10 = y0 * th.nx + x1;
                const i01 = y1 * th.nx + x0; const i11 = y1 * th.nx + x1;

                t = (activeTemp.data[i00]||15)*(1-dx)*(1-dy) + (activeTemp.data[i10]||15)*dx*(1-dy) + (activeTemp.data[i01]||15)*(1-dx)*dy + (activeTemp.data[i11]||15)*dx*dy;
            }
            return { u, v, t };
        }

        // THREE.JS SETUP
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 250;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.rotateSpeed = 0.35; // Sanfte, kontrollierte Drehung ohne Überschießen
        controls.zoomSpeed = 0.8;
        controls.minDistance = 110;
        controls.maxDistance = 600;
        controls.enablePan = false;

        // Ambient Light
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        // BASE EARTH SPHERE
        const earthRadius = 100;
        const earthGeometry = new THREE.SphereGeometry(earthRadius, 128, 128);
        const textureLoader = new THREE.TextureLoader();
        // High-res dark earth texture from three-globe
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-dark.jpg');
        const earthMaterial = new THREE.MeshBasicMaterial({ map: earthTexture });
        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        
        // Rotate earth to match typical map coordinates (Prime Meridian in center)
        earthMesh.rotation.y = -Math.PI / 2;
        earthMesh.renderOrder = 0;
        scene.add(earthMesh);

        // DATA SPHERE (CANVAS)
        const canvas = document.createElement('canvas');
        canvas.width = 2048;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const imgData = ctx.createImageData(canvas.width, canvas.height);

        const canvasTexture = new THREE.CanvasTexture(canvas);
        canvasTexture.minFilter = THREE.LinearFilter;
        canvasTexture.magFilter = THREE.LinearFilter;
        canvasTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const dataGeometry = new THREE.SphereGeometry(earthRadius + 0.3, 128, 128);
        const dataMaterial = new THREE.MeshBasicMaterial({ 
            map: canvasTexture, 
            transparent: true, 
            opacity: 0.90,
            depthWrite: false
        });
        const dataMesh = new THREE.Mesh(dataGeometry, dataMaterial);
        dataMesh.rotation.y = -Math.PI / 2;
        dataMesh.renderOrder = 1;
        scene.add(dataMesh);

        // SCREEN-SPACE WIND & CITY LABELS (Windy.com Architektur - IMMER GESTOCHEN SCHARF!)
        const screenWindCanvas = document.getElementById('screenWindCanvas');
        let screenW = window.innerWidth;
        let screenH = window.innerHeight;
        screenWindCanvas.width = screenW;
        screenWindCanvas.height = screenH;
        const screenWindCtx = screenWindCanvas.getContext('2d');

        const cityLabelsCanvas = document.getElementById('cityLabelsCanvas');
        cityLabelsCanvas.width = screenW;
        cityLabelsCanvas.height = screenH;
        const cityCtx = cityLabelsCanvas.getContext('2d');

        const particleCount = 4000; // Perfektes Mittelmaß (nicht zu voll, nicht zu leer)
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
            particles.push({ 
                x: Math.random() * screenW, 
                y: Math.random() * screenH, 
                age: Math.random() * 80, 
                lifespan: 50 + Math.random() * 60 
            });
        }

        let isInteracting = false;
        controls.addEventListener('start', () => { isInteracting = true; });
        controls.addEventListener('end', () => { isInteracting = false; });

        const tempNextVec = new THREE.Vector3();

        function renderScreenWindParticles(timeScale = 1.0) {
            // Beim Ziehen/Drehen altes Bild rasch verblassen, damit nichts verschmiert
            screenWindCtx.globalCompositeOperation = 'destination-in';
            screenWindCtx.fillStyle = isInteracting ? 'rgba(0, 0, 0, 0.70)' : 'rgba(0, 0, 0, 0.935)'; 
            screenWindCtx.fillRect(0, 0, screenW, screenH);
            screenWindCtx.globalCompositeOperation = 'source-over';
            
            screenWindCtx.beginPath();
            screenWindCtx.strokeStyle = 'rgba(255, 255, 255, 0.60)'; // Perfekt ausbalancierte Deckkraft (60%)
            screenWindCtx.lineWidth = 1.05; // Feines, klares Mittelmaß (1.05px)

            // Kamera-Parameter für schnelles analytisches Raycasting
            const m = camera.matrixWorld.elements;
            const Cx = m[12], Cy = m[13], Cz = m[14];
            const Rx = m[0], Ry = m[1], Rz = m[2];
            const Ux = m[4], Uy = m[5], Uz = m[6];
            const Fx = -m[8], Fy = -m[9], Fz = -m[10];

            const tanHalfFov = Math.tan((camera.fov * Math.PI) / 360);
            const aspect = screenW / screenH;
            const cLenSq = Cx * Cx + Cy * Cy + Cz * Cz;
            const rEarth = earthRadius;
            const rSq = rEarth * rEarth;


            for (let i = 0; i < particleCount; i++) {
                const p = particles[i];

                const ndcX = (p.x / screenW) * 2 - 1;
                const ndcY = -(p.y / screenH) * 2 + 1;
                const xc = ndcX * aspect * tanHalfFov;
                const yc = ndcY * tanHalfFov;

                let Dx = xc * Rx + yc * Ux + Fx;
                let Dy = xc * Ry + yc * Uy + Fy;
                let Dz = xc * Rz + yc * Uz + Fz;
                const dLen = Math.hypot(Dx, Dy, Dz);
                Dx /= dLen; Dy /= dLen; Dz /= dLen;

                const cDotD = Cx * Dx + Cy * Dy + Cz * Dz;
                const disc = cDotD * cDotD - (cLenSq - rSq);

                if (disc < 0) {
                    // Außerhalb des Globus im Weltall: Neu auf dem sichtbaren Bildschirmbereich platzieren
                    p.x = screenW * 0.5 + (Math.random() - 0.5) * screenW * 0.75;
                    p.y = screenH * 0.5 + (Math.random() - 0.5) * screenH * 0.75;
                    p.age = 0;
                    continue;
                }

                // Treffpunkt auf der 3D-Kugel
                const t = -cDotD - Math.sqrt(disc);
                const Hx = Cx + t * Dx;
                const Hy = Cy + t * Dy;
                const Hz = Cz + t * Dz;

                // Drehung des Globus rückgängig machen (rotation.y = -Math.PI / 2)
                const Px = Hz;
                const Py = Hy;
                const Pz = -Hx;

                const vFrac = Math.acos(Math.min(Math.max(Py / rEarth, -1), 1)) / Math.PI;
                const lat = 90 - vFrac * 180;
                let uFrac = Math.atan2(Pz, -Px) / (2 * Math.PI);
                if (uFrac < 0) uFrac += 1;
                const lng = uFrac * 360 - 180;

                const real = getInterpolatedData(lat, lng);
                const u = real.u;
                const v = real.v;

                if (isNaN(u) || isNaN(v) || (u === 0 && v === 0)) {
                    p.age += timeScale;
                    if (p.age > p.lifespan) {
                        p.x = screenW * 0.5 + (Math.random() - 0.5) * screenW * 0.75;
                        p.y = screenH * 0.5 + (Math.random() - 0.5) * screenH * 0.75;
                        p.age = 0;
                    }
                    continue;
                }

                let cosLat = Math.cos(lat * Math.PI / 180);
                if (cosLat < 0.15) cosLat = 0.15;

                // Richtungsvektor auf dem Bildschirm ermitteln
                const deltaEps = 0.005;
                const testLat = lat + v * deltaEps;
                const testLng = lng + (u / cosLat) * deltaEps;

                const uNext = (testLng + 180) / 360;
                const vNext = (90 - testLat) / 180;
                const PnextX = - rEarth * Math.cos(uNext * Math.PI * 2) * Math.sin(vNext * Math.PI);
                const PnextY = rEarth * Math.cos(vNext * Math.PI);
                const PnextZ = rEarth * Math.sin(uNext * Math.PI * 2) * Math.sin(vNext * Math.PI);

                // Globus-Drehung (y = -PI/2): X_world = -Z_local, Z_world = X_local
                tempNextVec.set(-PnextZ, PnextY, PnextX).project(camera);

                const testScreenX = (tempNextVec.x * 0.5 + 0.5) * screenW;
                const testScreenY = (-tempNextVec.y * 0.5 + 0.5) * screenH;

                let dirX = testScreenX - p.x;
                let dirY = testScreenY - p.y;
                const dirLen = Math.hypot(dirX, dirY);

                if (dirLen < 0.0001) {
                    p.age += timeScale;
                    continue;
                }

                dirX /= dirLen;
                dirY /= dirLen;

                // FESTE GESCHWINDIGKEIT IN BILDSCHIRM-PIXELN (Exakt wie im 2D-Original: windSpeed * 0.035!)
                // Dadurch wird der Wind beim Heranzoomen NIEMALS mehr beschleunigt!
                const windSpeed = Math.hypot(u, v);
                const screenStep = windSpeed * 0.035 * timeScale;

                const nextScreenX = p.x + dirX * screenStep;
                const nextScreenY = p.y + dirY * screenStep;

                if (p.age > p.lifespan || tempNextVec.z > 1.0) {
                    p.x = screenW * 0.5 + (Math.random() - 0.5) * screenW * 0.75;
                    p.y = screenH * 0.5 + (Math.random() - 0.5) * screenH * 0.75;
                    p.age = 0;
                } else {
                    screenWindCtx.moveTo(p.x, p.y);
                    screenWindCtx.lineTo(nextScreenX, nextScreenY);
                    p.x = nextScreenX;
                    p.y = nextScreenY;
                    p.age += timeScale;
                }
            }

            screenWindCtx.stroke();
        }

        const clock = new THREE.Clock();

        // ANIMATION LOOP (Mit Delta-Time Normalisierung & adaptiver Drehgeschwindigkeit)
        function animate() {
            requestAnimationFrame(animate);
            
            // Exakte physikalische 1:1 Grab-and-Drag Rotation für jeden Zoom-Level:
            // Die Kugeloberfläche bleibt jetzt exakt unter dem Mauszeiger "gegriffen", ohne wegzuspringen!
            const dist = camera.position.length();
            const h = Math.max(dist - earthRadius, 1);
            const tanHalfFov = Math.tan((camera.fov * Math.PI) / 360);
            controls.rotateSpeed = (h * tanHalfFov) / (Math.PI * earthRadius);
            controls.dampingFactor = dist < 140 ? 0.16 : 0.08;
            
            controls.update();
            
            const delta = Math.min(clock.getDelta(), 0.05);
            const timeScale = delta * 60;
            
            renderScreenWindParticles(timeScale);
            if (typeof renderCityLabels === 'function') renderCityLabels();
            
            renderer.render(scene, camera);
        }

        // MATHEMATISCHE SPHERICAL-TO-VERTEX FORMEL (Exakt wie Three.js SphereGeometry)
        function latLngToSphereVertex(lat, lng, radius) {
            const u = (lng + 180) / 360;
            const v = (90 - lat) / 180;
            const x = - radius * Math.cos( u * Math.PI * 2 ) * Math.sin( v * Math.PI );
            const y = radius * Math.cos( v * Math.PI );
            const z = radius * Math.sin( u * Math.PI * 2 ) * Math.sin( v * Math.PI );
            return new THREE.Vector3(x, y, z);
        }

        function sphereVertexToLatLng(pt, radius) {
            const v = Math.acos(Math.min(Math.max(pt.y / radius, -1), 1)) / Math.PI;
            const lat = 90 - v * 180;
            let u = Math.atan2(pt.z, -pt.x) / (2 * Math.PI);
            if (u < 0) u += 1;
            const lng = u * 360 - 180;
            return { lat, lng };
        }

        // ECHTE 3D-VEKTORGRENZEN (GPU-gerendert - kein Pixeln beim Zoomen!)
        function create3DGeoJsonLines(geojson, radius, colorHex, opacity) {
            const positions = [];
            function addRing(ring) {
                for (let i = 0; i < ring.length - 1; i++) {
                    const p1 = ring[i];
                    const p2 = ring[i + 1];
                    const v1 = latLngToSphereVertex(p1[1], p1[0], radius);
                    const v2 = latLngToSphereVertex(p2[1], p2[0], radius);

                    positions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z);
                }
            }

            geojson.features.forEach(feature => {
                const geom = feature.geometry;
                if (!geom) return;
                if (geom.type === 'Polygon') {
                    geom.coordinates.forEach(addRing);
                } else if (geom.type === 'MultiPolygon') {
                    geom.coordinates.forEach(poly => poly.forEach(addRing));
                } else if (geom.type === 'LineString') {
                    addRing(geom.coordinates);
                } else if (geom.type === 'MultiLineString') {
                    geom.coordinates.forEach(addRing);
                }
            });

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: opacity,
                depthWrite: false
            });
            const lineMesh = new THREE.LineSegments(geom, mat);
            lineMesh.rotation.y = -Math.PI / 2;
            lineMesh.renderOrder = 3;
            scene.add(lineMesh);
            return lineMesh;
        }

        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson')
            .then(r => r.json())
            .then(data => {
                create3DGeoJsonLines(data, earthRadius + 0.7, 0x262626, 0.52); // Dezentere, weniger dicke Ländergrenzen
            });
            
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_1_states_provinces_lines.geojson')
            .then(r => r.json())
            .then(data => {
                create3DGeoJsonLines(data, earthRadius + 0.7, 0x3a3a3a, 0.20); // Noch dünnere, sehr feine Bundesstaatengrenzen
            });

        // 3D-STADTUMRISSE (Bebauungsgrenzen für Metropolregionen bei Zoom)
        let urbanMesh = null;
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_urban_areas.geojson')
            .then(r => r.json())
            .then(data => {
                urbanMesh = create3DGeoJsonLines(data, earthRadius + 0.65, 0x111111, 0.45);
                urbanMesh.renderOrder = 3;
                urbanMesh.visible = false;
            });

        // DYNAMISCHE STÄDTE-LABELS & MARKER
        let citiesData = [];
        const cityGermanNames = {
            'Munich': 'München',
            'Cologne': 'Köln',
            'Nuremberg': 'Nürnberg',
            'Vienna': 'Wien',
            'Geneva': 'Genf',
            'Prague': 'Prag',
            'Rome': 'Rom',
            'Warsaw': 'Warschau',
            'Brussels': 'Brüssel',
            'Copenhagen': 'Kopenhagen',
            'Venice': 'Venedig'
        };

        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_populated_places_simple.geojson')
            .then(r => r.json())
            .then(data => {
                citiesData = data.features.map(f => {
                    const lat = f.properties.latitude;
                    const lng = f.properties.longitude;
                    const localV = latLngToSphereVertex(lat, lng, earthRadius + 0.7);
                    // Globus-Drehung (y = -PI/2): X_world = -Z_local, Z_world = X_local
                    const worldPos = new THREE.Vector3(-localV.z, localV.y, localV.x);
                    const rawName = f.properties.name;
                    const name = cityGermanNames[rawName] || rawName;
                    return {
                        name: name,
                        lat: lat,
                        lng: lng,
                        scalerank: f.properties.scalerank !== undefined ? f.properties.scalerank : 5,
                        worldPos: worldPos
                    };
                });
            });

        function renderCityLabels() {
            cityCtx.clearRect(0, 0, screenW, screenH);
            const dist = camera.position.length();

            // Stadtumrisse sanft einblenden erst bei deutlichem Nah-Zoom
            if (urbanMesh) {
                const urbanAlpha = Math.max(0, Math.min((155 - dist) / 35, 0.4));
                urbanMesh.material.opacity = urbanAlpha;
                urbanMesh.visible = urbanAlpha > 0.01;
            }

            // Städte-Namen erst bei näherem Zoom einblenden (erst ab dist < 160)
            if (dist > 160 || citiesData.length === 0) return;

            const fadeAlpha = Math.min((160 - dist) / 25, 1.0);

            // Je näher man heranzoomt, desto mehr Städte werden detailliert sichtbar (sehr selektiv)
            let maxRank = 0; // Erst nur Hauptstädte / Megacities
            if (dist <= 140) maxRank = 2; // Wichtige Großstädte
            if (dist <= 125) maxRank = 4; // Regionale Zentren

            const cx = camera.position.x;
            const cy = camera.position.y;
            const cz = camera.position.z;
            const rSqThreshold = (earthRadius * earthRadius) * 1.06; // Exakte Kugel-Horizont-Formel

            cityCtx.save();
            cityCtx.globalAlpha = fadeAlpha;
            cityCtx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
            cityCtx.textBaseline = 'middle';

            for (let i = 0; i < citiesData.length; i++) {
                const city = citiesData[i];
                if (city.scalerank > maxRank) continue;

                // MATHEMATISCH EXAKTE HORIZONT-PRÜFUNG: P · C > R^2
                // Verhindert zu 100%, dass Städte an den Rändern oder durch den Globus scheinen
                const pDotC = city.worldPos.x * cx + city.worldPos.y * cy + city.worldPos.z * cz;
                if (pDotC <= rSqThreshold) continue;

                // Auf Bildschirm projizieren
                tempNextVec.copy(city.worldPos).project(camera);
                if (tempNextVec.z > 1.0) continue;

                const sx = (tempNextVec.x * 0.5 + 0.5) * screenW;
                const sy = (-tempNextVec.y * 0.5 + 0.5) * screenH;

                // Ausreichend Abstand zum Bildschirmrand
                if (sx < 35 || sx > screenW - 35 || sy < 35 || sy > screenH - 35) continue;

                // Kleiner dezenter Stadt-Punkt in Schwarz mit weißem Rand
                cityCtx.beginPath();
                cityCtx.arc(sx, sy, 2.5, 0, Math.PI * 2);
                cityCtx.fillStyle = '#111111';
                cityCtx.fill();
                cityCtx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                cityCtx.lineWidth = 1.0;
                cityCtx.stroke();

                // SCHWARZER STADTNAME MIT DEZENTEM WEISSEM HALO FÜR PERFEKTE LESBARKEIT
                cityCtx.shadowColor = 'rgba(255, 255, 255, 0.9)';
                cityCtx.shadowBlur = 3;
                cityCtx.fillStyle = '#000000';
                cityCtx.fillText(city.name, sx + 6, sy);
                cityCtx.shadowColor = 'transparent';
            }
            cityCtx.restore();
        }

        function generateHeatmapTexture() {
            const data = imgData.data;
            for (let y = 0; y < canvas.height; y++) {
                let lat = 90 - (y / canvas.height) * 180;
                for (let x = 0; x < canvas.width; x++) {
                    let lng = (x / canvas.width) * 360 - 180;
                    
                    let real = getInterpolatedData(lat, lng);
                    let color;

                    if (currentMode === 'temp') {
                        color = d3.rgb(colorScaleTemp(real.t));
                    } else {
                        const speed = Math.sqrt(real.u * real.u + real.v * real.v) * 3.6;
                        color = d3.rgb(colorScaleWind(speed));
                    }
                    
                    let index = (y * canvas.width + x) * 4;
                    data[index] = color ? color.r : 0;
                    data[index + 1] = color ? color.g : 0;
                    data[index + 2] = color ? color.b : 0;
                    data[index + 3] = 255; // 100% reine, leuchtende Farben wie bei Windy!
                }
            }
            ctx.putImageData(imgData, 0, 0);
            canvasTexture.needsUpdate = true;
        }


        // UI & EVENT HANDLERS
        let clickedPopupPoint = null;
        const popupEl = document.getElementById('popup');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function updatePopupContent() {
            if (!clickedPopupPoint) return;
            const real = getInterpolatedData(clickedPopupPoint.lat, clickedPopupPoint.lng);
            let html = "";
            if (currentMode === 'temp') {
                html = `${real.t.toFixed(1)} °C`;
            } else {
                const speedKmh = Math.sqrt(real.u * real.u + real.v * real.v) * 3.6;
                html = `${speedKmh.toFixed(1)} km/h`;
            }
            popupEl.innerText = html;
        }

        // Handle Click for popup
        window.addEventListener('click', (event) => {
            if (event.clientY > window.innerHeight - 100) return; // Don't click through UI
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earthMesh);
            
            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // Convert 3D intersection point to Lat/Lng
                const pt = intersect.point.clone();
                pt.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
                
                clickedPopupPoint = sphereVertexToLatLng(pt, earthRadius);
                popupEl.style.display = 'block';
                popupEl.style.left = event.clientX + 'px';
                popupEl.style.top = event.clientY + 'px';
                updatePopupContent();
            } else {
                clickedPopupPoint = null;
                popupEl.style.display = 'none';
            }
        });

        // Update popup position when rotating
        controls.addEventListener('change', () => {
            if (clickedPopupPoint) {
                const localPos = latLngToSphereVertex(clickedPopupPoint.lat, clickedPopupPoint.lng, earthRadius);
                const worldPos = localPos.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2);
                
                const dotProduct = worldPos.clone().normalize().dot(camera.position.clone().normalize());
                
                if (dotProduct < 0.05) { // Pointing away from camera
                    popupEl.style.display = 'none';
                } else {
                    popupEl.style.display = 'block';
                    const pos = worldPos.clone().project(camera);
                    const x = (pos.x * .5 + .5) * window.innerWidth;
                    const y = (pos.y * -.5 + .5) * window.innerHeight;
                    popupEl.style.left = x + 'px';
                    popupEl.style.top = y + 'px';
                }
            }
        });

        function getLiveStepIndex() {
            if (typeof tempData === 'undefined' || tempData.length === 0) return 0;
            const now = Date.now();
            if (tempData[0].timeMs) {
                let bestIdx = 0;
                let minDiff = Infinity;
                for (let i = 0; i < tempData.length; i++) {
                    const diff = Math.abs(tempData[i].timeMs - now);
                    if (diff < minDiff) {
                        minDiff = diff;
                        bestIdx = i;
                    }
                }
                return bestIdx;
            }
            const idx = tempData.findIndex(t => t.hour === 0);
            return idx !== -1 ? idx : Math.min(8, tempData.length - 1);
        }

        function formatDisplayTime(step, hourOffset) {
            const now = new Date();
            const nowStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            
            if (step && (step.timeMs || step.timestamp)) {
                const d = new Date(step.timeMs || step.timestamp);
                const dayStr = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'short' });
                const timeStr = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
                
                if (hourOffset === 0) {
                    return `Live (${nowStr} Uhr | Modell: ${timeStr})`;
                } else if (hourOffset < 0) {
                    return `${dayStr}, ${timeStr} (vor ${Math.abs(hourOffset)}h)`;
                } else {
                    return `${dayStr}, ${timeStr} (+${hourOffset}h)`;
                }
            } else {
                if (hourOffset === 0) return `Live (${nowStr} Uhr)`;
                return hourOffset < 0 ? `Vor ${Math.abs(hourOffset)} Stunden` : `In ${hourOffset} Stunden`;
            }
        }

        function updateActiveData() {
            const liveIdx = getLiveStepIndex();
            const stepOffset = Math.round(currentHourOffset / 3);
            
            if (typeof tempData !== 'undefined' && tempData.length > 0) {
                const targetIdx = Math.max(0, Math.min(tempData.length - 1, liveIdx + stepOffset));
                activeTemp = tempData[targetIdx];
            }
            if (typeof windData !== 'undefined' && windData.length > 0) {
                const targetIdx = Math.max(0, Math.min(windData.length - 1, liveIdx + stepOffset));
                activeWind = windData[targetIdx];
            }
            
            const titleEl = document.getElementById('timeDisplayTitle');
            if (titleEl) {
                titleEl.innerText = formatDisplayTime(activeTemp, currentHourOffset);
            }

            if (currentMode === 'temp') generateHeatmapTexture();
            updatePopupContent();
        }

        // Live-Uhrzeit alle 60 Sekunden prüfen und bei Live-Stellung aktualisieren
        setInterval(() => {
            if (currentHourOffset === 0) {
                updateActiveData();
            }
        }, 60000);

        function switchLayer(mode) {
            currentMode = mode;
            
            document.getElementById('btn-temp').className = mode === 'temp' ? 'toggle-btn active' : 'toggle-btn';
            document.getElementById('btn-wind').className = mode === 'wind' ? 'toggle-btn active' : 'toggle-btn';
            
            if (mode === 'temp') {
                document.getElementById('legend-min').innerText = '-30°C';
                document.getElementById('legend-max').innerText = '+50°C';
                document.getElementById('legend-bar').style.background = 'linear-gradient(to right, #8c52ff, #a473b6, #b388ff, #88ccee, #3399cc, #1d5cae, #1b7a42, #32962a, #55ad26, #84c424, #b2d820, #d8e61e, #f7e318, #f8be17, #f69519, #eb6814, #e03e16, #dc2626, #b71c1c, #800808, #480202, #200000)'; 
                document.getElementById('timeLabel').innerText = 'Live Oberflächentemperatur (3D Globus)';
                generateHeatmapTexture();
            } else {
                document.getElementById('legend-min').innerText = '0 km/h';
                document.getElementById('legend-max').innerText = '100+ km/h';
                document.getElementById('legend-bar').style.background = 'linear-gradient(to right, #1a1a3a, #0033cc, #00ccff, #00ff00, #ffff00, #ff6600, #cc00ff)';
                document.getElementById('timeLabel').innerText = 'Live Wind-Geschwindigkeit (3D Globus)';
                generateHeatmapTexture();
            }
        }
        window.switchLayer = switchLayer;

        const timeSlider = document.getElementById('timeSlider');
        const playBtn = document.getElementById('playBtn');
        let playInterval = null;

        function togglePlay() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
                playBtn.innerText = '▶ Play';
            } else {
                playBtn.innerText = '⏸ Pause';
                playInterval = setInterval(() => {
                    let val = parseInt(timeSlider.value) + 3;
                    if (val > 48) val = -24; 
                    timeSlider.value = val;
                    timeSlider.dispatchEvent(new Event('input'));
                }, 1000); 
            }
        }
        playBtn.addEventListener('click', togglePlay);
        
        timeSlider.addEventListener('input', (e) => {
            currentHourOffset = parseInt(e.target.value);
            updateActiveData();
        });

        window.addEventListener('resize', () => {
            screenW = window.innerWidth;
            screenH = window.innerHeight;
            screenWindCanvas.width = screenW;
            screenWindCanvas.height = screenH;
            if (typeof cityLabelsCanvas !== 'undefined') {
                cityLabelsCanvas.width = screenW;
                cityLabelsCanvas.height = screenH;
            }
            camera.aspect = screenW / screenH;
            camera.updateProjectionMatrix();
            renderer.setSize(screenW, screenH);
        });

        // INIT
        updateActiveData();
        switchLayer('temp');
        animate();

    </script>
</body>
</html>
