        function getWeatherIcon(t, wind) {
            if (t <= 0) return '❄️';
            if (wind > 35) return '💨';
            if (t >= 25) return '☀️';
            if (t >= 16) return '🌤️';
            if (t >= 8) return '⛅';
            return '☁️';
        }

        function getTimezoneForLocation(lat, lng, country) {
            if (!country) country = '';
            const c = country.toLowerCase();
            if (c.includes('deutschland') || c.includes('germany') || c.includes('france') || c.includes('frankreich') || 
                c.includes('italy') || c.includes('italien') || c.includes('spain') || c.includes('spanien') || 
                c.includes('schweiz') || c.includes('switzerland') || c.includes('austria') || c.includes('österreich') || 
                c.includes('netherlands') || c.includes('niederlande') || c.includes('belgium') || c.includes('belgien') || 
                c.includes('poland') || c.includes('polen') || c.includes('sweden') || c.includes('schweden') || 
                c.includes('norway') || c.includes('norwegen') || c.includes('denmark') || c.includes('dänemark') || 
                c.includes('czech') || c.includes('tschech')) return 'Europe/Berlin';
            if (c.includes('united kingdom') || c.includes('großbritannien') || c.includes('ireland') || c.includes('irland') || c.includes('portugal')) return 'Europe/London';
            if (c.includes('greece') || c.includes('griechenland') || c.includes('finland') || c.includes('finnland') || 
                c.includes('turkey') || c.includes('türkei') || c.includes('ukraine') || c.includes('romania') || c.includes('rumänien')) return 'Europe/Athens';
            if (c.includes('japan')) return 'Asia/Tokyo';
            if (c.includes('china')) return 'Asia/Shanghai';
            if (c.includes('india') || c.includes('indien')) return 'Asia/Kolkata';
            if (c.includes('australia') || c.includes('australien')) return lng < 128 ? 'Australia/Perth' : 'Australia/Sydney';
            if (c.includes('new zealand') || c.includes('neuseeland')) return 'Pacific/Auckland';
            if (c.includes('united states') || c.includes('usa')) {
                if (lng < -140) return 'Pacific/Honolulu';
                if (lat > 50) return 'America/Anchorage';
                if (lng < -114) return 'America/Los_Angeles';
                if (lng < -102) return 'America/Denver';
                if (lng < -86) return 'America/Chicago';
                return 'America/New_York';
            }
            if (c.includes('canada') || c.includes('kanada')) {
                if (lng < -115) return 'America/Vancouver';
                if (lng < -100) return 'America/Edmonton';
                if (lng < -85) return 'America/Winnipeg';
                return 'America/Toronto';
            }
            if (c.includes('brazil') || c.includes('brasilien')) return 'America/Sao_Paulo';
            if (c.includes('argentina') || c.includes('argentinien')) return 'America/Argentina/Buenos_Aires';
            if (c.includes('russia') || c.includes('russland')) {
                if (lng < 40) return 'Europe/Moscow';
                if (lng < 60) return 'Asia/Yekaterinburg';
                if (lng < 90) return 'Asia/Novosibirsk';
                if (lng < 110) return 'Asia/Krasnoyarsk';
                if (lng < 130) return 'Asia/Irkutsk';
                if (lng < 145) return 'Asia/Yakutsk';
                return 'Asia/Vladivostok';
            }
            return null;
        }

        function formatLocationTime(targetDate, ianaTz, lat, lng) {
            if (ianaTz) {
                try {
                    return new Intl.DateTimeFormat('de-DE', {
                        timeZone: ianaTz,
                        hour: '2-digit',
                        minute: '2-digit'
                    }).format(targetDate);
                } catch(e) {}
            }
            const utcHours = targetDate.getUTCHours();
            const utcMinutes = targetDate.getUTCMinutes();
            const totalMinutes = utcHours * 60 + utcMinutes + Math.round((lng / 15) * 60);
            const normMinutes = ((totalMinutes % 1440) + 1440) % 1440;
            const h = Math.floor(normMinutes / 60).toString().padStart(2, '0');
            const m = (normMinutes % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        function formatLocationHourCard(targetDate, ianaTz, lat, lng, isFirst) {
            if (isFirst) return 'Jetzt';
            if (ianaTz) {
                try {
                    return new Intl.DateTimeFormat('de-DE', {
                        timeZone: ianaTz,
                        hour: '2-digit',
                        minute: '2-digit'
                    }).format(targetDate);
                } catch(e) {}
            }
            const utcHours = targetDate.getUTCHours();
            const totalHours = Math.round(utcHours + (lng / 15));
            const h = (((totalHours % 24) + 24) % 24).toString().padStart(2, '0');
            return `${h}:00`;
        }

        function showLocationForecast(lat, lng, name, country, customTz) {
            if (!name) name = "Ausgewählter Ort";
            const tz = customTz || getTimezoneForLocation(lat, lng, country);
            const localTimeStr = formatLocationTime(new Date(), tz, lat, lng);

            const placeEl = document.getElementById('forecastPlaceName');
            const countryEl = document.getElementById('forecastCountry');
            if (placeEl) placeEl.innerText = name;
            if (countryEl) {
                const countryPart = country ? `${country} · ` : `${lat.toFixed(1)}°N, ${lng.toFixed(1)}°E · `;
                countryEl.innerText = `${countryPart}🕒 ${localTimeStr} Uhr (Ortszeit)`;
            }

            if (typeof tempData === 'undefined' || tempData.length === 0) return;

            const liveIdx = getLiveStepIndex();
            const liveStep = tempData[liveIdx] || tempData[0];
            const liveTemp = getTempAtStep(liveStep, lat, lng);
            const liveInterp = getInterpolatedData(lat, lng);
            const windSpeedKmh = Math.round(Math.sqrt(liveInterp.u * liveInterp.u + liveInterp.v * liveInterp.v) * 3.6);

            const iconEl = document.getElementById('forecastCurrentIcon');
            const tempEl = document.getElementById('forecastCurrentTemp');
            const windEl = document.getElementById('forecastCurrentWind');
            const minMaxEl = document.getElementById('forecastMinMax');

            if (iconEl) iconEl.innerText = getWeatherIcon(liveTemp, windSpeedKmh);
            if (tempEl) tempEl.innerText = Math.round(liveTemp) + '°';
            if (windEl) windEl.innerText = windSpeedKmh + ' km/h';

            const miniIconEl = document.getElementById('forecastMiniIcon');
            const miniTempEl = document.getElementById('forecastMiniTemp');
            if (miniIconEl) miniIconEl.innerText = getWeatherIcon(liveTemp, windSpeedKmh);
            if (miniTempEl) miniTempEl.innerText = Math.round(liveTemp) + '°C';

            // Min/Max und 48h Zeitstreifen
            const futureSteps = [];
            let minT = Infinity;
            let maxT = -Infinity;

            const maxSteps = Math.min(tempData.length, liveIdx + 17);
            for (let i = liveIdx; i < maxSteps; i++) {
                const step = tempData[i];
                const t = getTempAtStep(step, lat, lng);
                if (t < minT) minT = t;
                if (t > maxT) maxT = t;
                futureSteps.push({ step, t, hourOffset: (i - liveIdx) * 3 });
            }

            if (minMaxEl) minMaxEl.innerText = `${Math.round(minT)}° / ${Math.round(maxT)}°`;

            const timelineEl = document.getElementById('forecastTimeline');
            if (timelineEl) {
                let timelineHtml = '';
                futureSteps.forEach((item, idx) => {
                    const d = item.step.timestamp ? new Date(item.step.timestamp) : new Date(Date.now() + item.hourOffset * 3600000);
                    let timeLabel = formatLocationHourCard(d, tz, lat, lng, idx === 0);
                    if (idx > 0 && d.getHours() === 0) {
                        timeLabel = d.toLocaleDateString('de-DE', { weekday: 'short' });
                    }
                    const icon = getWeatherIcon(item.t, 10);
                    const activeClass = item.hourOffset === currentHourOffset ? 'active' : '';

                    timelineHtml += `
                        <div class="forecast-hour-card ${activeClass}" data-offset="${item.hourOffset}" title="${d.toLocaleString('de-DE')}: ${Math.round(item.t)}°C">
                            <span class="forecast-hour-time">${timeLabel}</span>
                            <span class="forecast-hour-icon">${icon}</span>
                            <span class="forecast-hour-temp">${Math.round(item.t)}°</span>
                        </div>
                    `;
                });

                timelineEl.innerHTML = timelineHtml;

                timelineEl.querySelectorAll('.forecast-hour-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const offset = parseInt(card.dataset.offset);
                        timeSlider.value = offset;
                        timeSlider.dispatchEvent(new Event('input'));
                        timelineEl.querySelectorAll('.forecast-hour-card').forEach(c => c.classList.remove('active'));
                        card.classList.add('active');
                    });
                });
            }

            if (forecastContainer) forecastContainer.style.display = 'block';
        }

        // UI & EVENT HANDLERS
        let clickedPopupPoint = null;
        const popupEl = document.getElementById('popup');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function updatePopupContent() {
            if (!clickedPopupPoint) return;
            const real = getInterpolatedData(clickedPopupPoint.lat, clickedPopupPoint.lng);
            let html = "";
            if (currentMode === 'temp') {
                html = `${real.t.toFixed(1)} °C`;
            } else {
                const speedKmh = Math.sqrt(real.u * real.u + real.v * real.v) * 3.6;
                html = `${speedKmh.toFixed(1)} km/h`;
            }
            popupEl.innerText = html;
        }

        // Wisch- / Drag-Erkennung (Unterscheidung zwischen echtem Tippen und Globus-Verschieben)
        let pointerStartX = 0;
        let pointerStartY = 0;
        let isPointerDragging = false;

        window.addEventListener('pointerdown', (e) => {
            pointerStartX = e.clientX;
            pointerStartY = e.clientY;
            isPointerDragging = false;
        }, { passive: true });

        window.addEventListener('pointermove', (e) => {
            const dx = e.clientX - pointerStartX;
            const dy = e.clientY - pointerStartY;
            if (dx * dx + dy * dy > 36) { // Mehr als 6 Pixel Verschiebung = Wisch-/Drag-Geste
                isPointerDragging = true;
            }
        }, { passive: true });

        // Sobald der User den Globus rotiert, scrollt oder verschiebt: Temperatur-Popup sofort schließen!
        controls.addEventListener('start', () => {
            if (clickedPopupPoint) {
                clickedPopupPoint = null;
                popupEl.style.display = 'none';
            }
        });

        // Handle Click for popup & forecast (NUR bei echtem Tippen/Klicken)
        window.addEventListener('click', (event) => {
            // Wisch- oder Drehgesten ignorieren (KEIN unbeabsichtigtes Popup beim Scrollen!)
            if (isPointerDragging) return;

            // Klicks auf Suchleiste, Prognose-Card oder Bottom-Dock ignorieren
            if (event.target.closest('#search-container') || 
                event.target.closest('#forecast-container') || 
                event.target.closest('#timeline-container')) return;
            
            // Bei Klick außerhalb der Suche Dropdown schließen
            if (!event.target.closest('#search-container')) {
                searchSuggestions.style.display = 'none';
            }

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earthMesh);
            
            if (intersects.length > 0) {
                const intersect = intersects[0];
                
                // Convert 3D intersection point to Lat/Lng
                const pt = intersect.point.clone();
                pt.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
                
                clickedPopupPoint = sphereVertexToLatLng(pt, earthRadius);
                popupEl.style.display = 'block';
                popupEl.style.left = event.clientX + 'px';
                popupEl.style.top = event.clientY + 'px';
                updatePopupContent();

                // Nächste bekannte Stadt ermitteln oder Koordinaten anzeigen
                let nearestCity = null;
                let minDistSq = Infinity;
                const checkCount = Math.min(citiesData.length, 500);
                for (let i = 0; i < checkCount; i++) {
                    const c = citiesData[i];
                    const dLat = c.lat - clickedPopupPoint.lat;
                    const dLng = (c.lng - clickedPopupPoint.lng) * Math.cos(c.lat * Math.PI / 180);
                    const dSq = dLat * dLat + dLng * dLng;
                    if (dSq < minDistSq) {
                        minDistSq = dSq;
                        nearestCity = c;
                    }
                }
                const pName = (nearestCity && minDistSq < 0.5) ? nearestCity.name : "Ausgewählter Ort";
                const pCountry = (nearestCity && minDistSq < 0.5) ? nearestCity.country : "";
                showLocationForecast(clickedPopupPoint.lat, clickedPopupPoint.lng, pName, pCountry);
            } else {
                clickedPopupPoint = null;
                popupEl.style.display = 'none';
            }
        });

        // Update popup position when rotating
        controls.addEventListener('change', () => {
            if (clickedPopupPoint) {
                const localPos = latLngToSphereVertex(clickedPopupPoint.lat, clickedPopupPoint.lng, earthRadius);
                const worldPos = localPos.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2);
                
                const dotProduct = worldPos.clone().normalize().dot(camera.position.clone().normalize());
                const pos = worldPos.clone().project(camera);
                
                if (dotProduct < 0.05 || pos.z > 1.0) { // Pointing away or behind camera
                    popupEl.style.display = 'none';
                } else {
                    const x = (pos.x * .5 + .5) * window.innerWidth;
                    const y = (pos.y * -.5 + .5) * window.innerHeight;
                    if (x < -100 || x > window.innerWidth + 100 || y < -100 || y > window.innerHeight + 100) {
                        popupEl.style.display = 'none';
                    } else {
                        popupEl.style.display = 'block';
                        popupEl.style.left = x + 'px';
                        popupEl.style.top = y + 'px';
                    }
                }
            }
        });

        function getLiveStepIndex() {
            if (typeof tempData === 'undefined' || tempData.length === 0) return 0;
            const now = Date.now();
            if (tempData[0].timeMs) {
                let bestIdx = 0;
                let minDiff = Infinity;
                for (let i = 0; i < tempData.length; i++) {
                    const diff = Math.abs(tempData[i].timeMs - now);
                    if (diff < minDiff) {
                        minDiff = diff;
                        bestIdx = i;
                    }
                }
                return bestIdx;
            }
            const idx = tempData.findIndex(t => t.hour === 0);
            return idx !== -1 ? idx : Math.min(8, tempData.length - 1);
        }

        function formatDisplayTime(step, hourOffset) {
            const now = new Date();
            const nowStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            
            if (step && (step.timeMs || step.timestamp)) {
                const d = new Date(step.timeMs || step.timestamp);
                const dayStr = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: 'short' });
                const timeStr = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
                
                if (hourOffset === 0) {
                    return `Live (${nowStr} Uhr | Modell: ${timeStr})`;
                } else if (hourOffset < 0) {
                    return `${dayStr}, ${timeStr} (vor ${Math.abs(hourOffset)}h)`;
                } else {
                    return `${dayStr}, ${timeStr} (+${hourOffset}h)`;
                }
            } else {
                if (hourOffset === 0) return `Live (${nowStr} Uhr)`;
                return hourOffset < 0 ? `Vor ${Math.abs(hourOffset)} Stunden` : `In ${hourOffset} Stunden`;
            }
        }

        function updateActiveData() {
            const liveIdx = getLiveStepIndex();
            const stepOffset = Math.round(currentHourOffset / 3);
            
            let targetIdx = 0;
            if (typeof tempData !== 'undefined' && tempData.length > 0) {
                targetIdx = Math.max(0, Math.min(tempData.length - 1, liveIdx + stepOffset));
                activeTemp = tempData[targetIdx];
            }
            if (typeof windData !== 'undefined' && windData.length > 0) {
                const windIdx = Math.max(0, Math.min(windData.length - 1, liveIdx + stepOffset));
                activeWind = windData[windIdx];
            }
            
            const titleEl = document.getElementById('timeDisplayTitle');
            if (titleEl) {
                titleEl.innerText = formatDisplayTime(activeTemp, currentHourOffset);
            }

            const textures = currentMode === 'temp' ? tempTextures : windTextures;
            if (textures.length > 0 && textures[targetIdx]) {
                const curTex = textures[targetIdx];
                dataMaterial.uniforms.u_dataA.value = curTex;
                dataMaterial.uniforms.u_dataB.value = curTex;
                dataMaterial.uniforms.u_blend.value = 0.0;
                if (curTex && curTex.image && dataMaterial.uniforms.u_texSize) {
                    dataMaterial.uniforms.u_texSize.value.set(curTex.image.width, curTex.image.height);
                }
            }

            updatePopupContent();
        }

        // Live-Uhrzeit alle 60 Sekunden prüfen und bei Live-Stellung aktualisieren
        setInterval(() => {
            if (currentHourOffset === 0) {
                updateActiveData();
            }
        }, 60000);

        function switchLayer(mode) {

            document.getElementById('btn-temp').className = mode === 'temp' ? 'toggle-btn active' : 'toggle-btn';
            document.getElementById('btn-wind').className = mode === 'wind' ? 'toggle-btn active' : 'toggle-btn';

                dataMaterial.uniforms.u_colorRamp.value = colorRampTempTex;
                dataMaterial.uniforms.u_minVal.value = useFloat ? minTempRange : 0.0;
                dataMaterial.uniforms.u_maxVal.value = useFloat ? maxTempRange : 1.0;
                if (dataMaterial.uniforms.u_texSize) dataMaterial.uniforms.u_texSize.value.set(1441.0, 721.0);
            } else {
                document.getElementById('legend-min').innerText = '0 km/h';
                document.getElementById('legend-max').innerText = '100+ km/h';
                document.getElementById('legend-bar').style.background = 'linear-gradient(to right, #1a1a3a, #0033cc, #00ccff, #00ff00, #ffff00, #ff6600, #cc00ff)';

        window.switchLayer = switchLayer;

        const timeSlider = document.getElementById('timeSlider');
        const playBtn = document.getElementById('playBtn');

        function togglePlay() {
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
                playBtn.innerText = '▶ Play';
            } else {
                playBtn.innerText = '⏸ Pause';
                playInterval = setInterval(() => {
                    let val = parseInt(timeSlider.value) + 3;
                    if (val > 48) val = -24; 
                    timeSlider.value = val;
                    timeSlider.dispatchEvent(new Event('input'));
                }, 1000); 
            }
        }
        playBtn.addEventListener('click', togglePlay);
        
        timeSlider.addEventListener('input', (e) => {
            currentHourOffset = parseInt(e.target.value);
            updateActiveData();
        });

        window.addEventListener('resize', () => {
            screenW = window.innerWidth;
            screenH = window.innerHeight;
            screenWindCanvas.width = screenW;
            screenWindCanvas.height = screenH;
            if (typeof cityLabelsCanvas !== 'undefined') {
                cityLabelsCanvas.width = screenW;
                cityLabelsCanvas.height = screenH;
            }
            camera.aspect = screenW / screenH;
            camera.updateProjectionMatrix();
            renderer.setSize(screenW, screenH);
        });

        // IP-BASIERTE STANDORTERMITTLUNG & WILLKOMMENS-FLUG (DSGVO-konform, keine Cookies)
        let userLocationDetected = false;
        async function detectUserLocationAndFly() {
            if (userLocationDetected) return;
            try {
                let lat = null, lng = null, city = '', country = '', tz = null;
                try {
                    const res = await fetch('https://get.geojs.io/v1/ip/geo.json');
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.latitude && data.longitude) {
                            lat = parseFloat(data.latitude);
                            lng = parseFloat(data.longitude);
                            city = data.city || 'Dein Standort';
                            country = data.country || '';
                            tz = data.timezone || null;
                        }
                    }
                } catch(e) {}

                // Fallback zu freeipapi falls geojs blockiert oder nicht antwortet
                if (lat === null) {
                    try {
                        const res2 = await fetch('https://freeipapi.com/api/json');
                        if (res2.ok) {
                            const data2 = await res2.json();
                            if (data2 && typeof data2.latitude === 'number' && typeof data2.longitude === 'number') {
                                lat = data2.latitude;
                                lng = data2.longitude;
                                city = data2.cityName || 'Dein Standort';
                                country = data2.countryName || '';
                                tz = (data2.timeZones && data2.timeZones[0]) || null;
                            }
                        }
                    } catch(e) {}
                }

                if (lat !== null && lng !== null) {
                    userLocationDetected = true;
                    console.log(`Standort via IP lokalisiert: ${city}, ${country} (${lat}, ${lng}) [${tz}]`);
                    setTimeout(() => {
                        flyToLocation(lat, lng, city);
                        showLocationForecast(lat, lng, city, country, tz);
                    }, 800);
                }
            } catch(err) {
                console.log('IP-Standort konnte nicht ermittelt werden:', err);
            }
        }

        // AUTOMATISCHE LIVE-AKTUALISIERUNG DER WETTERDATEN (alle 15 Minuten)
        let currentManifestTimestamp = null;
        async function checkWeatherUpdate() {
            try {
                const res = await fetch('manifest.json?_t=' + Date.now());
                if (!res.ok) return;
                const info = await res.json();
                if (currentManifestTimestamp && info.timestamp > currentManifestTimestamp) {
                    console.log('Neuer GFS Wetter-Modelllauf verfügbar! Aktualisiere Daten...', info.model);
                    reloadWeatherData();
                }
                currentManifestTimestamp = info.timestamp;
            } catch(e) {}
        }

        function reloadWeatherData() {
            const oldScript = document.getElementById('tempDataScript');
            const s = document.createElement('script');
            s.id = 'tempDataScript';
            s.src = 'temp_data.js?_v=' + Date.now();
            s.onload = () => {
                console.log('Wetterdaten erfolgreich im laufenden Betrieb aktualisiert!');
                if (typeof reloadDataTextures === 'function') {
                    reloadDataTextures();
                }
                updateActiveData();
                if (forecastContainer && forecastContainer.style.display !== 'none') {
                    const pName = document.getElementById('forecastPlaceName').innerText;
                    const pCountry = document.getElementById('forecastCountry').innerText.split(' · ')[0];
                    if (clickedPopupPoint) {
                        showLocationForecast(clickedPopupPoint.lat, clickedPopupPoint.lng, pName, pCountry);
                    }
                }
            };
            if (oldScript && oldScript.parentNode) {
                oldScript.parentNode.replaceChild(s, oldScript);
            } else {
                document.head.appendChild(s);
            }
        }

        // INIT
        if (typeof tempMetadata !== 'undefined' && tempMetadata.nx < 1440) {
            console.warn('Veralteter 0.5° Browser-Cache festgestellt! Aktualisiere sofort auf 0.25° GFS Modell...');
            reloadWeatherData();
        }
        updateActiveData();
        switchLayer('temp');
        animate();
        detectUserLocationAndFly();
        checkWeatherUpdate();
        setInterval(checkWeatherUpdate, 15 * 60 * 1000);

    </script>
</body>
</html>
