    <style>
        body { margin: 0; padding: 0; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; overflow: hidden; }
        #canvas-container { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* VEREINTES MODERNES BOTTOM-DOCK (Zeitleiste & Farblegende) */

            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(18, 18, 22, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
            z-index: 40;
            width: 360px;
            max-width: calc(100vw - 48px);
            color: #ffffff;
            user-select: none;
            transition: all 0.25s ease;
        }
        .timeline-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        #playBtn {
            background: rgba(0, 204, 255, 0.16);
            border: 1px solid rgba(0, 204, 255, 0.45);
            color: #00ccff;
            padding: 4px 12px;
            font-size: 12.5px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        #playBtn:hover {
            background: rgba(0, 204, 255, 0.35);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 204, 255, 0.4);
        }
        #timeDisplayTitle {
            font-weight: 600;
            font-size: 12.5px;
            color: #ffffff;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #timeSlider {
            width: 100%;
            margin: 6px 0;
            cursor: pointer;
            accent-color: #00ccff;
        }
        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8e8e93;
            font-weight: 500;
            margin-bottom: 8px;
        }
        #legend {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 600;
            color: #bbb;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .color-bar {
            flex-grow: 1;
            height: 7px;
            margin: 0 10px;
            border-radius: 4px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5) inset;
        }

        #popup {
            position: absolute;
            background: white;
            color: #333;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -100%);
            margin-top: -10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 20;
        }
        #popup::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        #screenWindCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        #cityLabelsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        /* SUCHE / SEARCH BAR */
        #search-container {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 330px;
            max-width: calc(100vw - 48px);
            z-index: 50;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }
        #search-box {
            display: flex;
            align-items: center;
            background: rgba(20, 20, 24, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);

            color: #fff;

        }
        #searchClearBtn {

            border: none;
            color: #ccc;
            border-radius: 50%;

            height: 20px;

            align-items: center;
            justify-content: center;

        }
        #searchSuggestions {

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);

            overflow-y: auto;

        .suggestion-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            transition: background 0.15s;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover, .suggestion-item.active {
            background: rgba(0, 204, 255, 0.16);
        }
        .suggestion-main {
            display: flex;

        .suggestion-name {

        .suggestion-online {

            font-style: italic;
        }

        /* KOMPAKTE PROGNOSE-KARTE / FORECAST CARD */
        #forecast-container {

            left: 24px;

        .forecast-title-box {

        .forecast-place {

            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;

        }
        .forecast-sub {
            font-size: 11.5px;
            color: #8e8e93;
            margin-top: 1px;
        }
        .forecast-btn-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .forecast-action-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #ccc;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;

        .forecast-action-btn:hover {

            color: #fff;
        }
        #forecastMiniSummary {
            display: none;
            align-items: center;
            gap: 5px;

        #forecast-container.minimized #forecastBody {

        .forecast-current {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        }
        .forecast-temp-group {

            align-items: baseline;
            gap: 2px;

            color: #00ccff;

            display: flex;
            flex-direction: column;
            gap: 3px;

        .forecast-stat-item {

            justify-content: flex-end;

            color: #ddd;

        .forecast-timeline-title {

            font-weight: 600;

            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;

            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;

        .forecast-timeline-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .forecast-timeline-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .forecast-hour-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 44px;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.15s;
        }
        .forecast-hour-card:hover, .forecast-hour-card.active {
            background: rgba(0, 204, 255, 0.2);
            border-color: #00ccff;
        }
        .forecast-hour-time {
            font-size: 10px;
            color: #999;
            margin-bottom: 3px;
        }
        .forecast-hour-icon {
            font-size: 14px;
            margin-bottom: 3px;
        }
        .forecast-hour-temp {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        /* RESPONSIVE MOBILE OPTIMIERUNG (< 768px) */
        @media (max-width: 768px) {
            #search-container {
                top: 12px;
                left: 12px;
                right: 12px;
                width: auto;
                max-width: none;
            }
            #search-box {
                padding: 7px 12px;
            }
            #forecast-container {
                top: 60px;
                left: 12px;
                right: 12px;
                width: auto;
                max-width: none;

            }
            #forecast-container.minimized {

            }
            .forecast-place {

            .forecast-sub {

<body>
    <div id="canvas-container"></div>
    <canvas id="screenWindCanvas"></canvas>
    <canvas id="cityLabelsCanvas"></canvas>
    <div id="popup"></div>

    <!-- Suchleiste -->
    <div id="search-container">
        <div id="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Ort oder Stadt suchen..." autocomplete="off" spellcheck="false">
            <button id="searchClearBtn" title="Löschen">✕</button>
        </div>
        <div id="searchSuggestions" style="display: none;"></div>
    </div>

    <!-- Kompakte Wetter-Prognosekarte -->
    <div id="forecast-container">
        <div class="forecast-header" id="forecastHeader">
            <div class="forecast-title-box">
                <div id="forecastPlaceName" class="forecast-place">München</div>
                <div id="forecastCountry" class="forecast-sub">Deutschland</div>
            </div>
            <div id="forecastMiniSummary">
                <span id="forecastMiniIcon">☀️</span>
                <span id="forecastMiniTemp">16°</span>
            </div>
            <div class="forecast-btn-group">
                <button id="forecastToggleBtn" class="forecast-action-btn" title="Minimieren / Ausklappen">▼</button>
                <button id="forecastCloseBtn" class="forecast-action-btn" title="Schließen">✕</button>
            </div>
        </div>
        
        <div id="forecastBody">
            <div class="forecast-current">
                <div class="forecast-temp-group">
                    <span id="forecastCurrentIcon" class="forecast-weather-icon">☀️</span>
                    <span id="forecastCurrentTemp" class="forecast-big-temp">16°</span>
                    <span class="forecast-unit">C</span>
                </div>
                <div class="forecast-stats">
                    <div class="forecast-stat-item">
                        <span class="forecast-stat-label">Wind</span>
                        <span id="forecastCurrentWind" class="forecast-stat-val">14 km/h</span>
                    </div>
                    <div class="forecast-stat-item">
                        <span class="forecast-stat-label">Min / Max</span>
                        <span id="forecastMinMax" class="forecast-stat-val">9° / 19°</span>
                    </div>
                </div>
            </div>
            
            <div class="forecast-timeline-title">24h / 48h Wettertrend (GFS Modell)</div>
            <div id="forecastTimeline" class="forecast-timeline-scroll"></div>
        </div>
    </div>
    
    <!-- Schlankes, vereintes Bottom-Dock (Zeitleiste + Farblegende) -->
    <div id="timeline-container">
        <div class="timeline-top-row">
            <button id="playBtn">▶ Play</button>
            <div id="timeDisplayTitle">Live (Jetzt)</div>
        </div>
        <input type="range" id="timeSlider" min="-24" max="48" step="3" value="0">
        <div class="time-labels">
            <span>-24h</span>
            <span>Live</span>
            <span>+48h</span>
        </div>
        <div id="legend">
            <span id="legend-min">-30°C</span>
            <div id="legend-bar" class="color-bar" style="background: linear-gradient(to right, #8c52ff 0.0%, #a473b6 12.5%, #b388ff 18.8%, #88ccee 25.0%, #3399cc 31.3%, #1d5cae 37.5%, #1b7a42 41.3%, #32962a 46.3%, #55ad26 51.2%, #84c424 56.3%, #b2d820 58.8%, #d8e61e 61.3%, #f7e318 62.5%, #ffdb00 67.5%, #ffa600 71.3%, #ff6200 75.0%, #ee3a14 78.1%, #dc2222 81.3%, #a80e14 84.4%, #700408 87.5%, #521a10 91.3%, #38140c 95.0%, #1e0c08 97.5%, #000000 100.0%);"></div>
            <span id="legend-max">+50°C</span>
        </div>
        <!-- Versteckte Elemente für JS-Kompatibilität -->
        <span id="timeLabel" style="display: none;"></span>
        <div id="ui-container" style="display: none;"></div>
        <div id="layer-toggles" style="display: none;">
            <button id="btn-temp"></button>
            <button id="btn-wind"></button>
        </div>
    </div>

    <script>
        // GLOBALS
        let currentMode = 'temp'; 
        let currentHourOffset = 0;
        let activeTemp = null;
        let activeWind = null;
        
        // INTERPOLATION DATA
        const colorScaleWind = d3.scaleLinear()
            .domain([0, 3, 7, 12, 17, 24, 30])
            .range(['#1a1a3a', '#0033cc', '#00ccff', '#00ff00', '#ffff00', '#ff6600', '#cc00ff'])
            .clamp(true);

        const colorScaleTemp = d3.scaleLinear()
            .domain([-60, -40, -30, -20, -15, -10, -5, 0, 3, 7, 11, 15, 17, 19, 20, 24, 27, 30, 32.5, 35, 37.5, 40, 43, 46, 48, 50, 55])
            .range([
                '#ffffff', '#6010a0', '#8c52ff', '#a473b6', '#b388ff', '#88ccee', '#3399cc', '#1d5cae', 
                '#1b7a42', '#32962a', '#55ad26', '#84c424', '#b2d820', '#d8e61e', 
                '#f7e318', '#ffdb00', '#ffa600', '#ff6200', '#ee3a14', '#dc2222', '#a80e14', '#700408', 
                '#521a10', '#38140c', '#1e0c08', '#000000', '#000000'
            ])
            .clamp(true);

        function getInterpolatedData(lat, lng) {
            let u=0, v=0, t=15;
            let lon0360 = lng < 0 ? lng + 360 : lng;
            
            if (activeWind) {
                const wh = activeWind.u.header;
                let y = (wh.la1 - lat) / wh.dy;
                let x = lon0360 / wh.dx;
                
                let y0 = Math.floor(y); let x0 = Math.floor(x);
                let y1 = y0 + 1; let x1 = x0 + 1;

                if (y0 < 0) y0 = 0; if (y0 >= wh.ny) y0 = wh.ny - 1;
                if (y1 < 0) y1 = 0; if (y1 >= wh.ny) y1 = wh.ny - 1;
                if (x0 < 0) x0 = 0; if (x0 >= wh.nx) x0 = wh.nx - 1;
                if (x1 < 0) x1 = 0; if (x1 >= wh.nx) x1 = wh.nx - 1;

                let dy = y - y0; let dx = x - x0;
                const i00 = y0 * wh.nx + x0; const i10 = y0 * wh.nx + x1;
                const i01 = y1 * wh.nx + x0; const i11 = y1 * wh.nx + x1;

                u = (activeWind.u.data[i00]||0)*(1-dx)*(1-dy) + (activeWind.u.data[i10]||0)*dx*(1-dy) + (activeWind.u.data[i01]||0)*(1-dx)*dy + (activeWind.u.data[i11]||0)*dx*dy;
                v = (activeWind.v.data[i00]||0)*(1-dx)*(1-dy) + (activeWind.v.data[i10]||0)*dx*(1-dy) + (activeWind.v.data[i01]||0)*(1-dx)*dy + (activeWind.v.data[i11]||0)*dx*dy;
            }

            if (activeTemp) {
                const th = activeTemp.header;
                let y = (th.la1 - lat) / th.dy;
                let x = lon0360 / th.dx;
                
                let y0 = Math.floor(y); let x0 = Math.floor(x);
                let y1 = y0 + 1; let x1 = x0 + 1;

                if (y0 < 0) y0 = 0; if (y0 >= th.ny) y0 = th.ny - 1;
                if (y1 < 0) y1 = 0; if (y1 >= th.ny) y1 = th.ny - 1;
                if (x0 < 0) x0 = 0; if (x0 >= th.nx) x0 = th.nx - 1;
                if (x1 < 0) x1 = 0; if (x1 >= th.nx) x1 = th.nx - 1;

                let dy = y - y0; let dx = x - x0;
                const i00 = y0 * th.nx + x0; const i10 = y0 * th.nx + x1;
                const i01 = y1 * th.nx + x0; const i11 = y1 * th.nx + x1;

                const scale = activeTemp.scale || 1.0;
                const d = activeTemp.data;
                const t00 = (d[i00] !== undefined ? d[i00] * scale : 15);
                const t10 = (d[i10] !== undefined ? d[i10] * scale : 15);
                const t01 = (d[i01] !== undefined ? d[i01] * scale : 15);
                const t11 = (d[i11] !== undefined ? d[i11] * scale : 15);

                t = t00*(1-dx)*(1-dy) + t10*dx*(1-dy) + t01*(1-dx)*dy + t11*dx*dy;
            }
            return { u, v, t };
        }

        // THREE.JS SETUP
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 250;

            camera.position.set(11.37, 89.61, 86.40);
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        controls.rotateSpeed = 0.35; // Sanfte, kontrollierte Drehung ohne Überschießen

        controls.maxDistance = 600;
        controls.enablePan = false;

        // Ambient Light
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        // BASE EARTH SPHERE
        const earthRadius = 100;
        const earthGeometry = new THREE.SphereGeometry(earthRadius, 128, 128);
        const textureLoader = new THREE.TextureLoader();
        // High-res dark earth texture from three-globe
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-dark.jpg');
        const earthMaterial = new THREE.MeshBasicMaterial({ map: earthTexture });
        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        
        // Rotate earth to match typical map coordinates (Prime Meridian in center)
        earthMesh.rotation.y = -Math.PI / 2;
        earthMesh.renderOrder = 0;
        scene.add(earthMesh);

        // GPU WEBGL SHADER ENGINE (60 FPS STUFENLOSE WETTER-TEXTURGLÄTTUNG)
        const isWebGL2 = !!renderer.capabilities.isWebGL2;
        const hasFloatLinear = isWebGL2 && (renderer.extensions.has('OES_texture_float_linear') || renderer.extensions.has('EXT_color_buffer_float'));
        const useFloat = isWebGL2;

        // Farb-Rampen als 1024x1 1D Texturen vorbereiten
        function createColorRampTexture(scaleFunc, minVal, maxVal, width = 1024) {
            const data = new Uint8Array(width * 4);
            for (let i = 0; i < width; i++) {
                const val = minVal + (i / (width - 1)) * (maxVal - minVal);
                const col = d3.rgb(scaleFunc(val));
                data[i * 4 + 0] = col ? col.r : 0;
                data[i * 4 + 1] = col ? col.g : 0;
                data[i * 4 + 2] = col ? col.b : 0;
                data[i * 4 + 3] = 255;
            }
            const tex = new THREE.DataTexture(data, width, 1, THREE.RGBAFormat, THREE.UnsignedByteType);
            tex.generateMipmaps = false;
            tex.minFilter = THREE.LinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.wrapS = THREE.ClampToEdgeWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.needsUpdate = true;
            return tex;
        }

        const minTempRange = -60.0;
        const maxTempRange = 55.0;
        const maxWindKmh = 115.0;

        const colorRampTempTex = createColorRampTexture(colorScaleTemp, minTempRange, maxTempRange, 2048);
        const colorRampWindTex = createColorRampTexture(kmh => colorScaleWind(kmh / 3.6), 0.0, maxWindKmh, 2048);

        // Pre-baking der Wetterdaten in GPU-DataTextures (dauert dank Lookup-Tabelle nur ~80ms)
        function buildTempDataTexture(step) {
            const raw = step.data;
            const h = step.header || (typeof tempMetadata !== 'undefined' ? tempMetadata : { nx: 1440, ny: 721, dx: 0.25, dy: 0.25 });
            const nx = h.nx || 1440;
            const ny = h.ny || 721;
            const width = nx + 1;
            const height = ny;
            const scale = step.scale || 1.0;
            const span = maxTempRange - minTempRange;
            
            // Einmaliges Spalten-Lookup (-180°..+180° -> 0°..360° GFS Spaltenindex)
            const colLookup = new Int32Array(width);
            const halfNx = Math.floor(nx / 2);
            for (let x = 0; x < width; x++) {
                colLookup[x] = (x < halfNx) ? (x + halfNx) : (x - halfNx);
            }

            if (useFloat) {
                const buf = new Float32Array(width * height);
                let ptr = 0;
                for (let r = 0; r < height; r++) {
                    const rowOffset = ((ny - 1) - r) * nx;
                    for (let x = 0; x < width; x++) {
                        buf[ptr++] = raw[rowOffset + colLookup[x]] * scale;
                    }
                }
                const tex = new THREE.DataTexture(buf, width, height, THREE.RedFormat, THREE.FloatType);
                tex.generateMipmaps = false;
                const filter = hasFloatLinear ? THREE.LinearFilter : THREE.NearestFilter;
                tex.minFilter = filter;
                tex.magFilter = filter;
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.needsUpdate = true;
                return tex;
            } else {
                const buf = new Uint8Array(width * height * 4);
                let ptr = 0;
                for (let r = 0; r < height; r++) {
                    const rowOffset = ((ny - 1) - r) * nx;
                    for (let x = 0; x < width; x++) {
                        const val = raw[rowOffset + colLookup[x]] * scale;
                        const norm = Math.max(0, Math.min(255, Math.round(((val - minTempRange) / span) * 255)));
                        buf[ptr] = norm;
                        buf[ptr + 1] = norm;
                        buf[ptr + 2] = norm;
                        buf[ptr + 3] = 255;
                        ptr += 4;
                    }
                }
                const tex = new THREE.DataTexture(buf, width, height, THREE.RGBAFormat, THREE.UnsignedByteType);
                tex.generateMipmaps = false;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.needsUpdate = true;
                return tex;
            }
        }

        function buildWindDataTexture(step) {
            const uData = step.u.data;
            const vData = step.v.data;
            const width = 361;
            const height = 181;
            
            if (useFloat) {
                const buf = new Float32Array(width * height);
                let ptr = 0;
                for (let r = 0; r < height; r++) {
                    const gfsRow = 180 - r;
                    const rowOffset = gfsRow * 360;
                    for (let x = 0; x < width; x++) {
                        const lng = -180 + x * 1.0;
                        const lon360 = lng < 0 ? lng + 360 : lng;
                        const gfsCol = Math.round(lon360 / 1.0) % 360;
                        const idx = rowOffset + gfsCol;
                        const u = uData[idx] || 0;
                        const v = vData[idx] || 0;
                        buf[ptr++] = Math.sqrt(u * u + v * v) * 3.6;
                    }
                }
                const tex = new THREE.DataTexture(buf, width, height, THREE.RedFormat, THREE.FloatType);
                tex.generateMipmaps = false;
                const filter = hasFloatLinear ? THREE.LinearFilter : THREE.NearestFilter;
                tex.minFilter = filter;
                tex.magFilter = filter;
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.needsUpdate = true;
                return tex;
            } else {
                const buf = new Uint8Array(width * height * 4);
                let ptr = 0;
                for (let r = 0; r < height; r++) {
                    const gfsRow = 180 - r;
                    const rowOffset = gfsRow * 360;
                    for (let x = 0; x < width; x++) {
                        const lng = -180 + x * 1.0;
                        const lon360 = lng < 0 ? lng + 360 : lng;
                        const gfsCol = Math.round(lon360 / 1.0) % 360;
                        const idx = rowOffset + gfsCol;
                        const u = uData[idx] || 0;
                        const v = vData[idx] || 0;
                        const speedKmh = Math.sqrt(u * u + v * v) * 3.6;
                        const norm = Math.max(0, Math.min(255, Math.round((speedKmh / maxWindKmh) * 255)));
                        buf[ptr] = norm;
                        buf[ptr + 1] = norm;
                        buf[ptr + 2] = norm;
                        buf[ptr + 3] = 255;
                        ptr += 4;
                    }
                }
                const tex = new THREE.DataTexture(buf, width, height, THREE.RGBAFormat, THREE.UnsignedByteType);
                tex.generateMipmaps = false;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.needsUpdate = true;
                return tex;
            }
        }

        let tempTextures = (typeof tempData !== 'undefined') ? tempData.map(buildTempDataTexture) : [];
        let windTextures = (typeof windData !== 'undefined') ? windData.map(buildWindDataTexture) : [];

        function reloadDataTextures() {
            if (typeof tempData !== 'undefined') {
                tempTextures = tempData.map(buildTempDataTexture);
            }
            if (typeof windData !== 'undefined') {
                windTextures = windData.map(buildWindDataTexture);
            }
        }

        // ULTRA-HIGH-DEFINITION TEMPERATUR-SHADER: C2 QUINTIC SMOOTHING & VEKTOR-GLÄTTUNG
        const dataGeometry = new THREE.SphereGeometry(earthRadius + 0.3, 128, 128);
        const dataMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                precision highp float;
                uniform sampler2D u_dataA;
                uniform sampler2D u_dataB;
                uniform sampler2D u_colorRamp;
                uniform vec2 u_texSize;
                uniform float u_blend;
                uniform float u_minVal;
                uniform float u_maxVal;
                uniform float u_opacity;
                varying vec2 vUv;

                // C2-stetige Quintic-Spline Glättung (Ken Perlin Polynomial: 6f^5 - 15f^4 + 10f^3)
                // Eliminiert selbst winzigste 2. Ableitungs-Gitterkanten für absolut makellose, flüssige Vektor-Farbverläufe
                float sampleSmooth(sampler2D tex, vec2 uv) {
                    vec2 pos = uv * u_texSize - 0.5;
                    vec2 f = fract(pos);
                    vec2 i = (floor(pos) + 0.5) / u_texSize;
                    vec2 d = 1.0 / u_texSize;

                    // Quintic C2 Glättungskurve
                    vec2 w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);

                    float p00 = texture2D(tex, clamp(i, vec2(0.0), vec2(1.0))).r;
                    float p10 = texture2D(tex, clamp(i + vec2(d.x, 0.0), vec2(0.0), vec2(1.0))).r;
                    float p01 = texture2D(tex, clamp(i + vec2(0.0, d.y), vec2(0.0), vec2(1.0))).r;
                    float p11 = texture2D(tex, clamp(i + d, vec2(0.0), vec2(1.0))).r;

                    return mix(mix(p00, p10, w.x), mix(p01, p11, w.x), w.y);
                }

                void main() {
                    float valA = sampleSmooth(u_dataA, vUv);
                    float valB = sampleSmooth(u_dataB, vUv);
                    float val = mix(valA, valB, u_blend);
                    float norm = clamp((val - u_minVal) / (u_maxVal - u_minVal), 0.0, 1.0);
                    vec4 col = texture2D(u_colorRamp, vec2(norm, 0.5));
                    gl_FragColor = vec4(col.rgb, u_opacity);
                }
            `,
            uniforms: {
                u_dataA: { value: tempTextures[0] || null },
                u_dataB: { value: tempTextures[0] || null },
                u_colorRamp: { value: colorRampTempTex },
                u_texSize: { value: new THREE.Vector2(1441.0, 721.0) },
                u_blend: { value: 0.0 },
                u_minVal: { value: useFloat ? minTempRange : 0.0 },
                u_maxVal: { value: useFloat ? maxTempRange : 1.0 },
                u_opacity: { value: 0.90 }
            },
            transparent: true,
            depthWrite: false
        });
        const dataMesh = new THREE.Mesh(dataGeometry, dataMaterial);
        dataMesh.rotation.y = -Math.PI / 2;
        dataMesh.renderOrder = 1;
        scene.add(dataMesh);

        // SCREEN-SPACE WIND & CITY LABELS (Windy.com Architektur - IMMER GESTOCHEN SCHARF!)
        const screenWindCanvas = document.getElementById('screenWindCanvas');
        let screenW = window.innerWidth;
        let screenH = window.innerHeight;
        screenWindCanvas.width = screenW;
        screenWindCanvas.height = screenH;
        const screenWindCtx = screenWindCanvas.getContext('2d');

        const cityLabelsCanvas = document.getElementById('cityLabelsCanvas');
        cityLabelsCanvas.width = screenW;
        cityLabelsCanvas.height = screenH;
        const cityCtx = cityLabelsCanvas.getContext('2d');

        const particleCount = 5500; // Ausgewogene Dichte für den gesamten Bildschirm
        const particles = [];
        for (let i = 0; i < particleCount; i++) {
            particles.push({ 
                lat: 0, 
                lng: 0, 
                age: Math.random() * 80, 
                lifespan: 50 + Math.random() * 60,
                active: false
            });
        }

        let isInteracting = false;
        controls.addEventListener('start', () => { isInteracting = true; });
        controls.addEventListener('end', () => { isInteracting = false; });

        const lastWindCameraPos = new THREE.Vector3();
        const lastWindCameraQuat = new THREE.Quaternion();
        let lastWindDist = 280;
        const vpMatrix = new THREE.Matrix4();
        const tempVec0 = new THREE.Vector3();
        const tempVec1 = new THREE.Vector3();

        function renderScreenWindParticles(timeScale = 1.0) {
            const dist = camera.position.length();
            const h = Math.max(1, dist - earthRadius);

            // Zoom-Erkennung: Hat sich die Kameradistanz (Zoom) merklich verändert?
            const distDiff = Math.abs(dist - lastWindDist);
            const zoomRatio = distDiff / Math.max(lastWindDist, 1);

            // Erkennen, ob der Benutzer den Globus dreht, zieht oder zoomt (inkl. sanfter Dämpfung)
            const isCameraMoving = isInteracting || 
                camera.position.distanceToSquared(lastWindCameraPos) > 0.001 ||
                camera.quaternion.angleTo(lastWindCameraQuat) > 0.0005 ||
                zoomRatio > 0.003;

            lastWindCameraPos.copy(camera.position);
            lastWindCameraQuat.copy(camera.quaternion);

            if (isCameraMoving) {
                // Beim Drehen/Verschieben/Zoomen altes Bild sofort säubern -> Partikel bleiben 1:1 fest an der Geographie verankert
                screenWindCtx.clearRect(0, 0, screenW, screenH);
            } else {
                // Im Stillstand sanfte, elegante Schweife fließen lassen
                screenWindCtx.globalCompositeOperation = 'destination-in';
                screenWindCtx.fillStyle = 'rgba(0, 0, 0, 0.935)'; 
                screenWindCtx.fillRect(0, 0, screenW, screenH);
                screenWindCtx.globalCompositeOperation = 'source-over';
            }
            
            screenWindCtx.beginPath();
            screenWindCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)'; // Klare, elegante Sichtbarkeit
            screenWindCtx.lineWidth = 1.05;

            // Kamera-Parameter für schnelles analytisches Raycasting beim Partikel-Spawnen
            const m = camera.matrixWorld.elements;
            const Cx = m[12], Cy = m[13], Cz = m[14];
            const Rx = m[0], Ry = m[1], Rz = m[2];
            const Ux = m[4], Uy = m[5], Uz = m[6];
            const Fx = -m[8], Fy = -m[9], Fz = -m[10];

            const tanHalfFov = Math.tan((camera.fov * Math.PI) / 360);
            const aspect = screenW / screenH;
            const cLenSq = Cx * Cx + Cy * Cy + Cz * Cz;
            const rEarth = earthRadius;
            const rSq = rEarth * rEarth;

            // Blitzschnelle Matrix-Projektion (World -> Screen)
            vpMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);

            // Partikel immer im aktuell sichtbaren Bildausschnitt auf dem Globus platzieren
            function respawnOnScreen(p) {
                const sx = Math.random() * screenW;
                const sy = Math.random() * screenH;
                const ndcX = (sx / screenW) * 2 - 1;
                const ndcY = -(sy / screenH) * 2 + 1;
                const xc = ndcX * aspect * tanHalfFov;
                const yc = ndcY * tanHalfFov;

                let Dx = xc * Rx + yc * Ux + Fx;
                let Dy = xc * Ry + yc * Uy + Fy;
                let Dz = xc * Rz + yc * Uz + Fz;
                const dLen = Math.hypot(Dx, Dy, Dz);
                Dx /= dLen; Dy /= dLen; Dz /= dLen;

                const cDotD = Cx * Dx + Cy * Dy + Cz * Dz;
                const disc = cDotD * cDotD - (cLenSq - rSq);
                if (disc < 0) {
                    p.active = false;
                    p.age = p.lifespan;
                    return;
                }

                const t = -cDotD - Math.sqrt(disc);
                const Hx = Cx + t * Dx;
                const Hy = Cy + t * Dy;
                const Hz = Cz + t * Dz;

                // Globus-Drehung (rotation.y = -Math.PI / 2)
                const Px = Hz;
                const Py = Hy;
                const Pz = -Hx;

                const vFrac = Math.acos(Math.min(Math.max(Py / rEarth, -1), 1)) / Math.PI;
                p.lat = 90 - vFrac * 180;
                let uFrac = Math.atan2(Pz, -Px) / (2 * Math.PI);
                if (uFrac < 0) uFrac += 1;
                p.lng = uFrac * 360 - 180;
                p.age = Math.random() * 20;
                p.lifespan = 50 + Math.random() * 60;
                p.active = true;
            }

            // ANTI-CLUSTER BEIM HERAUSZOOMEN:
            // Wenn herausgezoomt wird (Kameradistanz wächst), würden zuvor im Nahbereich platzierte Partikel
            // zu einem dichten weißen Kasten zusammengedrückt. Daher werden Partikel bei Zoom-Änderung
            // gleichmäßig auf das gesamte neu sichtbare Bildfeld re-verteilt!
            if (zoomRatio > 0.02) {
                for (let i = 0; i < particleCount; i++) {
                    respawnOnScreen(particles[i]);
                    particles[i].age = Math.random() * particles[i].lifespan;
                }
                screenWindCtx.clearRect(0, 0, screenW, screenH);
            } else if (zoomRatio > 0.005) {
                const reseedCount = Math.floor(particleCount * 0.35);
                for (let k = 0; k < reseedCount; k++) {
                    const idx = (Math.random() * particleCount) | 0;
                    respawnOnScreen(particles[idx]);
                    particles[idx].age = Math.random() * particles[idx].lifespan;
                }
            }
            lastWindDist = dist;

            // Geschwindigkeitsskalierung: Bei näherem Zoom wird der geographische Schritt adaptiv skaliert,
            // sodass die optische Strichlänge auf dem Bildschirm immer perfekt gleichmäßig bleibt!
            const step = (h / earthRadius) * 0.0016 * timeScale;

            for (let i = 0; i < particleCount; i++) {
                const p = particles[i];

                if (!p.active || p.age > p.lifespan) {
                    respawnOnScreen(p);
                    continue;
                }

                // 1. Startposition im 3D-Weltraum
                const u0 = (p.lng + 180) / 360;
                const v0 = (90 - p.lat) / 180;
                const sinV0 = Math.sin(v0 * Math.PI);
                const cosV0 = Math.cos(v0 * Math.PI);
                const sinU0 = Math.sin(u0 * Math.PI * 2);
                const cosU0 = Math.cos(u0 * Math.PI * 2);

                const wx0 = - rEarth * sinU0 * sinV0;
                const wy0 = rEarth * cosV0;
                const wz0 = - rEarth * cosU0 * sinV0;

                // Verdeckungstest: Ist der Punkt auf der dem Betrachter zugewandten Vorderseite? (P . C > rSq)
                if (wx0 * Cx + wy0 * Cy + wz0 * Cz <= rSq) {
                    respawnOnScreen(p);
                    continue;
                }

                tempVec0.set(wx0, wy0, wz0).applyMatrix4(vpMatrix);
                const sx0 = (tempVec0.x * 0.5 + 0.5) * screenW;
                const sy0 = (-tempVec0.y * 0.5 + 0.5) * screenH;

                if (sx0 < 0 || sx0 > screenW || sy0 < 0 || sy0 > screenH) {
                    respawnOnScreen(p);
                    continue;
                }

                // Echte Winddaten am geographischen Ort abfragen
                const real = getInterpolatedData(p.lat, p.lng);
                const u = real.u;
                const v = real.v;

                if (isNaN(u) || isNaN(v) || (u === 0 && v === 0)) {
                    respawnOnScreen(p);
                    continue;
                }

                let cosLat = Math.cos(p.lat * Math.PI / 180);
                if (cosLat < 0.15) cosLat = 0.15;

                // Wind bewegt den Partikel auf der Erdoberfläche weiter
                const nextLat = p.lat + v * step;
                const nextLng = p.lng + (u / cosLat) * step;

                // 2. Zielposition im 3D-Weltraum
                const u1 = (nextLng + 180) / 360;
                const v1 = (90 - nextLat) / 180;
                const sinV1 = Math.sin(v1 * Math.PI);
                const cosV1 = Math.cos(v1 * Math.PI);
                const sinU1 = Math.sin(u1 * Math.PI * 2);
                const cosU1 = Math.cos(u1 * Math.PI * 2);

                const wx1 = - rEarth * sinU1 * sinV1;
                const wy1 = rEarth * cosV1;
                const wz1 = - rEarth * cosU1 * sinV1;

                tempVec1.set(wx1, wy1, wz1).applyMatrix4(vpMatrix);
                const sx1 = (tempVec1.x * 0.5 + 0.5) * screenW;
                const sy1 = (-tempVec1.y * 0.5 + 0.5) * screenH;

                screenWindCtx.moveTo(sx0, sy0);
                screenWindCtx.lineTo(sx1, sy1);

                p.lat = nextLat;
                p.lng = nextLng;
                p.age += timeScale;
            }

            screenWindCtx.stroke();
        }

        const clock = new THREE.Clock();

        let cameraAnimation = null;

        // ANIMATION LOOP (Mit Delta-Time Normalisierung & adaptiver Drehgeschwindigkeit)
        function animate() {
            requestAnimationFrame(animate);
            
            if (cameraAnimation) {
                const now = performance.now();
                const elapsed = now - cameraAnimation.startTime;
                let progress = Math.min(1.0, elapsed / cameraAnimation.duration);
                // Sanfte kubische Interpolation (Ease-in-out)
                const t = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                
                // Richtung auf der Kugel interpolieren
                const currentDir = new THREE.Vector3().copy(cameraAnimation.startUnit).lerp(cameraAnimation.targetUnit, t).normalize();
                
                // Sanfter Bogen während des Fluges für spektakuläre Perspektive
                const arch = Math.sin(progress * Math.PI) * Math.min(25, cameraAnimation.startDist * 0.12);
                const currentDist = (cameraAnimation.startDist + (cameraAnimation.targetDist - cameraAnimation.startDist) * t) + arch;
                
                camera.position.copy(currentDir.multiplyScalar(currentDist));
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                
                if (progress >= 1.0) {
                    const anim = cameraAnimation;
                    cameraAnimation = null;
                    controls.enabled = true;
                    
                    // Temperatur-Popup am Zielort aktivieren & anzeigen
                    clickedPopupPoint = { lat: anim.targetLat, lng: anim.targetLng };
                    updatePopupContent();
                    
                    const localP = latLngToSphereVertex(anim.targetLat, anim.targetLng, earthRadius);
                    const worldP = localP.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2);
                    const pProj = worldP.clone().project(camera);
                    popupEl.style.display = 'block';
                    popupEl.style.left = ((pProj.x * 0.5 + 0.5) * window.innerWidth) + 'px';
                    popupEl.style.top = ((-pProj.y * 0.5 + 0.5) * window.innerHeight) + 'px';
                }
            } else {
                // Exakte physikalische 1:1 Grab-and-Drag Rotation für jeden Zoom-Level:
                const dist = camera.position.length();
                const h = Math.max(dist - earthRadius, 1);
                const tanHalfFov = Math.tan((camera.fov * Math.PI) / 360);
                controls.rotateSpeed = (h * tanHalfFov) / (Math.PI * earthRadius);
                controls.dampingFactor = dist < 140 ? 0.16 : 0.08;
                controls.update();
            }
            
            const delta = Math.min(clock.getDelta(), 0.05);
            const timeScale = delta * 60;
            
            try {
                renderScreenWindParticles(timeScale);
            } catch(e) { /* wind render safe */ }
            try {
                if (typeof renderCityLabels === 'function') renderCityLabels();
            } catch(e) { /* city render safe */ }
            try {
                if (typeof updateHillshadeTiles === 'function') updateHillshadeTiles();
            } catch(e) { /* hillshade render safe */ }
            
            renderer.render(scene, camera);
        }

        // MATHEMATISCHE SPHERICAL-TO-VERTEX FORMEL (Exakt wie Three.js SphereGeometry)
        function latLngToSphereVertex(lat, lng, radius) {
            const u = (lng + 180) / 360;
            const v = (90 - lat) / 180;
            const x = - radius * Math.cos( u * Math.PI * 2 ) * Math.sin( v * Math.PI );
            const y = radius * Math.cos( v * Math.PI );
            const z = radius * Math.sin( u * Math.PI * 2 ) * Math.sin( v * Math.PI );
            return new THREE.Vector3(x, y, z);
        }

        function sphereVertexToLatLng(pt, radius) {
            const v = Math.acos(Math.min(Math.max(pt.y / radius, -1), 1)) / Math.PI;
            const lat = 90 - v * 180;
            let u = Math.atan2(pt.z, -pt.x) / (2 * Math.PI);
            if (u < 0) u += 1;
            const lng = u * 360 - 180;
            return { lat, lng };
        }

        // ECHTE 3D-VEKTORGRENZEN (GPU-gerendert - kein Pixeln beim Zoomen!)
        function create3DGeoJsonLines(geojson, radius, colorHex, opacity) {
            const positions = [];
            function addRing(ring) {
                for (let i = 0; i < ring.length - 1; i++) {
                    const p1 = ring[i];
                    const p2 = ring[i + 1];
                    const v1 = latLngToSphereVertex(p1[1], p1[0], radius);
                    const v2 = latLngToSphereVertex(p2[1], p2[0], radius);

                    positions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z);
                }
            }

            geojson.features.forEach(feature => {
                const geom = feature.geometry;
                if (!geom) return;
                if (geom.type === 'Polygon') {
                    geom.coordinates.forEach(addRing);
                } else if (geom.type === 'MultiPolygon') {
                    geom.coordinates.forEach(poly => poly.forEach(addRing));
                } else if (geom.type === 'LineString') {
                    addRing(geom.coordinates);
                } else if (geom.type === 'MultiLineString') {
                    geom.coordinates.forEach(addRing);
                }
            });

            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: opacity,
                depthWrite: false
            });
            const lineMesh = new THREE.LineSegments(geom, mat);
            lineMesh.rotation.y = -Math.PI / 2;
            lineMesh.renderOrder = 3;
            scene.add(lineMesh);
            return lineMesh;
        }

        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson')
            .then(r => r.json())
            .then(data => {
                create3DGeoJsonLines(data, earthRadius + 0.7, 0x262626, 0.52); // Dezentere, weniger dicke Ländergrenzen
            });
            
        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_1_states_provinces_lines.geojson')
            .then(r => r.json())
            .then(data => {
                create3DGeoJsonLines(data, earthRadius + 0.7, 0x3a3a3a, 0.20); // Noch dünnere, sehr feine Bundesstaatengrenzen
            });

        // 3D-BINNENSEEN & GEWÄSSER (Genfersee, Bodensee, Gardasee etc.)
        let lakesMesh = null;
        if (typeof lakesData !== 'undefined') {
            lakesMesh = create3DGeoJsonLines(lakesData, earthRadius + 0.68, 0x1a334d, 0.48);
        } else {
            fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_lakes.geojson')
                .then(r => r.json())
                .then(data => {
                    lakesMesh = create3DGeoJsonLines(data, earthRadius + 0.68, 0x1a334d, 0.48);
                }).catch(() => {});
        }

        // 3D-FLÜSSE & STROMNETZE (Rhein, Donau, Rhone, Elbe, Po, etc.)
        let riversMesh = null;
        function initRivers() {
            if (typeof riversData === 'undefined' || !riversData) return;
            const positions = [];
            const r = earthRadius + 0.66;
            function addLine(line) {
                for (let i = 0; i < line.length - 1; i++) {
                    const p1 = line[i];
                    const p2 = line[i + 1];
                    const v1 = latLngToSphereVertex(p1[1], p1[0], r);
                    const v2 = latLngToSphereVertex(p2[1], p2[0], r);
                    positions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z);
                }
            }
            for (let j = 0; j < riversData.length; j++) {
                const item = riversData[j];
                if (item.t === 1) {
                    addLine(item.c);
                } else if (item.t === 2) {
                    for (let k = 0; k < item.c.length; k++) {
                        addLine(item.c[k]);
                    }
                }
            }
            const geom = new THREE.BufferGeometry();
            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.LineBasicMaterial({
                color: 0x227bb8, // Frisches, klares Flussblau
                transparent: true,
                opacity: 0.65,
                depthWrite: false
            });
            riversMesh = new THREE.LineSegments(geom, mat);
            riversMesh.rotation.y = -Math.PI / 2;
            riversMesh.renderOrder = 3;
            riversMesh.visible = false;
            scene.add(riversMesh);
        }
        initRivers();

        // 3D-STRASSENNETZ & FERNSTRASSEN (Verbindungsachsen zwischen Metropolen)
        let roadsMesh = null;
        if (typeof roadsData !== 'undefined') {
            roadsMesh = create3DGeoJsonLines(roadsData, earthRadius + 0.67, 0x4a3d33, 0.32);
            roadsMesh.visible = false;
        }

        // 3D-STADTGEBIETE & KONTUREN (Inhalt bleibt dezent & hell wie in Bild 1)
        let urbanFillMesh = null;
        let urbanLineMesh = null;
        function initUrbanAreas() {
            if (typeof urbanFillVerts !== 'undefined' && typeof urbanLineVerts !== 'undefined') {
                const fillRadius = earthRadius + 0.63;
                const lineRadius = earthRadius + 0.65;

                // 1. Stadtinhalt / Bebaute Flächen (dezent, transparent - wie in Bild 1)
                const fillPos = new Float32Array(urbanFillVerts.length);
                for (let i = 0; i < urbanFillVerts.length; i++) {
                    fillPos[i] = urbanFillVerts[i] * fillRadius;
                }
                const fillGeom = new THREE.BufferGeometry();
                fillGeom.setAttribute('position', new THREE.BufferAttribute(fillPos, 3));
                const fillMat = new THREE.MeshBasicMaterial({
                    color: 0xd49b28, // Warmer Bernstein-/Goldton wie in Bild 1
                    transparent: true,
                    opacity: 0.20,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
                urbanFillMesh = new THREE.Mesh(fillGeom, fillMat);
                urbanFillMesh.rotation.y = -Math.PI / 2;
                urbanFillMesh.renderOrder = 2;
                urbanFillMesh.visible = false;
                scene.add(urbanFillMesh);

                // 2. Stadtumrisse / Konturlinien
                const linePos = new Float32Array(urbanLineVerts.length);
                for (let i = 0; i < urbanLineVerts.length; i++) {
                    linePos[i] = urbanLineVerts[i] * lineRadius;
                }
                const lineGeom = new THREE.BufferGeometry();
                lineGeom.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
                const lineMat = new THREE.LineBasicMaterial({
                    color: 0x8a6018, // Klare, warme Umrisslinie der Stadtgrenze
                    transparent: true,
                    opacity: 0.45,
                    depthWrite: false
                });
                urbanLineMesh = new THREE.LineSegments(lineGeom, lineMat);
                urbanLineMesh.rotation.y = -Math.PI / 2;
                urbanLineMesh.renderOrder = 3;
                urbanLineMesh.visible = false;
                scene.add(urbanLineMesh);
            }
        }
        initUrbanAreas();

        // DYNAMISCHE STÄDTE-LABELS & MARKER (7.340+ Orte weltweit)
        let citiesData = [];
        const cityGermanNames = {
            'Munich': 'München',
            'Cologne': 'Köln',
            'Nuremberg': 'Nürnberg',
            'Vienna': 'Wien',
            'Geneva': 'Genf',
            'Zurich': 'Zürich',
            'Prague': 'Prag',
            'Rome': 'Rom',
            'Milan': 'Mailand',
            'Florence': 'Florenz',
            'Naples': 'Neapel',
            'Venice': 'Venedig',
            'Warsaw': 'Warschau',
            'Brussels': 'Brüssel',
            'Copenhagen': 'Kopenhagen',
            'Lisbon': 'Lissabon',
            'Athens': 'Athen',
            'Bucharest': 'Bukarest',
            'Belgrade': 'Belgrad',
            'Moscow': 'Moskau',
            'Lucerne': 'Luzern',
            'Basel': 'Basel',
            'Bern': 'Bern'
        };

        function initCities() {
            const rawList = (typeof window !== 'undefined' && window.citiesDataRaw) ? window.citiesDataRaw : [];
            if (rawList.length > 0) {
                citiesData = rawList.map(item => {
                    const rawName = item[0];
                    const lat = item[1];
                    const lng = item[2];
                    const rank = item[3];
                    const country = item[4] || '';
                    const localV = latLngToSphereVertex(lat, lng, earthRadius + 0.7);
                    // Globus-Drehung (y = -PI/2): X_world = -Z_local, Z_world = X_local
                    const worldPos = new THREE.Vector3(-localV.z, localV.y, localV.x);
                    const name = cityGermanNames[rawName] || rawName;
                    return {
                        name,
                        rawName,
                        lat,
                        lng,
                        scalerank: rank,
                        country,
                        worldPos
                    };
                });
                citiesData.sort((a, b) => a.scalerank - b.scalerank);
            }
        }
        initCities();

        // Fallback: Falls cities_data.js nicht lokal geladen wurde, via Network laden
        if (citiesData.length === 0) {
            fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_populated_places_simple.geojson')
                .then(r => r.json())
                .then(data => {
                    citiesData = data.features.map(f => {
                        const lat = f.properties.latitude;
                        const lng = f.properties.longitude;
                        const localV = latLngToSphereVertex(lat, lng, earthRadius + 0.7);
                        const worldPos = new THREE.Vector3(-localV.z, localV.y, localV.x);
                        const rawName = f.properties.name;
                        const name = cityGermanNames[rawName] || rawName;
                        return {
                            name: name,
                            rawName: rawName,
                            lat: lat,
                            lng: lng,
                            scalerank: f.properties.scalerank !== undefined ? f.properties.scalerank : 5,
                            country: f.properties.adm0name || '',
                            worldPos: worldPos
                        };
                    });
                    citiesData.sort((a, b) => a.scalerank - b.scalerank);
                })
                .catch(() => {});
        }

        const tempCityVec = new THREE.Vector3();
        function renderCityLabels() {
            cityCtx.clearRect(0, 0, screenW, screenH);
            const dist = camera.position.length();

            // Straßennetz dezent bei Zoom einblenden
            if (roadsMesh) {
                const roadsAlpha = Math.max(0, Math.min((155 - dist) / 30, 0.32));
                roadsMesh.material.opacity = roadsAlpha;
                roadsMesh.visible = roadsAlpha > 0.01;
            }

            // Flüsse dezent bei Zoom einblenden
            if (riversMesh) {
                const riversAlpha = Math.max(0, Math.min((160 - dist) / 25, 0.55));
                riversMesh.material.opacity = riversAlpha;
                riversMesh.visible = riversAlpha > 0.01;
            }

            // Stadtumrisse & farbiger Stadtinhalt (Farbe bleibt konstant erhalten und wird beim Zoomen NICHT dunkler!)
            if (urbanFillMesh) {
                // Sanftes Einblenden bei Zoom ab dist < 160, bleibt dauerhaft auf 0.20 fixiert
                const urbanAlpha = Math.max(0, Math.min((160 - dist) / 25, 1.0)) * 0.20;
                urbanFillMesh.material.opacity = urbanAlpha;
                urbanFillMesh.visible = urbanAlpha > 0.005;
            }
            if (urbanLineMesh) {
                const urbanLineAlpha = Math.max(0, Math.min((160 - dist) / 25, 1.0)) * 0.45;
                urbanLineMesh.material.opacity = urbanLineAlpha;
                urbanLineMesh.visible = urbanLineAlpha > 0.005;
            }

            // Städte-Namen erst bei Zoom einblenden (ab dist < 165)
            if (dist > 165 || citiesData.length === 0) return;

            const fadeAlpha = Math.min((165 - dist) / 25, 0.85);

            // Dynamische Staffelung nach Zoom-Tiefe:
            // dist > 150: Nur Megacitys (Rank 0-1)
            // dist 135-150: Hauptstädte & Großstädte (Rank 0-2)
            // dist 122-135: Bedeutende Städte (Rank 0-4)
            // dist 114-122: Mittelstädte & Ballungsräume (Rank 0-6)
            // dist 107-114: Kleinere Städte & Bezirkshauptorte (Rank 0-8)
            // dist < 107: Hohe Detailstufe: Gemeinden, Orte & Alpentäler (Rank 0-10)
            let maxRank = 0;
            let minSpacingX = 66;
            let minSpacingY = 25;

            if (dist <= 107) {
                maxRank = 10;
                minSpacingX = 38;
                minSpacingY = 20;
            } else if (dist <= 114) {
                maxRank = 8;
                minSpacingX = 46;
                minSpacingY = 22;
            } else if (dist <= 122) {
                maxRank = 6;
                minSpacingX = 54;
                minSpacingY = 23;
            } else if (dist <= 135) {
                maxRank = 4;
                minSpacingX = 60;
                minSpacingY = 24;
            } else if (dist <= 150) {
                maxRank = 2;
                minSpacingX = 68;
                minSpacingY = 26;
            } else {
                maxRank = 1;
                minSpacingX = 75;
                minSpacingY = 28;
            }

            const cx = camera.position.x;
            const cy = camera.position.y;
            const cz = camera.position.z;
            const horizonThreshold = (earthRadius / dist) - 0.02;

            cityCtx.save();
            cityCtx.globalAlpha = fadeAlpha;
            cityCtx.textBaseline = 'middle';

            const placed = [];

            for (let i = 0; i < citiesData.length; i++) {
                const city = citiesData[i];
                if (city.scalerank > maxRank) continue;

                // Geometrisch exakte Horizont-Prüfung für ALLE Zoomstufen (selbst bei tiefstem Zoom dist <= 101.5):
                // Winkel zwischen Stadt und Kamera: cos(theta) = (P · C) / (|P| * |C|)
                const cosAngle = (city.worldPos.x * cx + city.worldPos.y * cy + city.worldPos.z * cz) / (100.7 * dist);
                if (cosAngle < horizonThreshold) continue;

                // Auf Bildschirm projizieren
                tempCityVec.copy(city.worldPos).project(camera);
                if (tempCityVec.z > 1.0) continue;

                const sx = (tempCityVec.x * 0.5 + 0.5) * screenW;
                const sy = (-tempCityVec.y * 0.5 + 0.5) * screenH;

                // Ausreichend Abstand zum Bildschirmrand
                if (sx < 20 || sx > screenW - 20 || sy < 20 || sy > screenH - 20) continue;

                // Intelligente Kollisionsvermeidung gegen Text-Überlappungen
                let collision = false;
                for (let j = 0; j < placed.length; j++) {
                    const p = placed[j];
                    if (Math.abs(sx - p.x) < minSpacingX && Math.abs(sy - p.y) < minSpacingY) {
                        collision = true;
                        break;
                    }
                }
                if (collision) continue;
                placed.push({ x: sx, y: sy });

                // Feiner, eleganter Stadt-Punkt mit weißem Kern & dunklem Ring
                cityCtx.beginPath();
                cityCtx.arc(sx, sy, 2.0, 0, Math.PI * 2);
                cityCtx.fillStyle = '#ffffff';
                cityCtx.fill();
                cityCtx.strokeStyle = '#1a1a1a';
                cityCtx.lineWidth = 1.0;
                cityCtx.stroke();

                // Lokale Temperatur ermitteln
                const real = getInterpolatedData(city.lat, city.lng);
                const tempStr = Math.round(real.t) + '°';

                // Edler, dezenter Stadtname zentriert oberhalb
                cityCtx.textAlign = 'center';
                cityCtx.shadowColor = 'rgba(255, 255, 255, 0.90)';
                cityCtx.shadowBlur = 3.0;
                cityCtx.fillStyle = '#181818';
                cityCtx.font = '500 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
                cityCtx.fillText(city.name, sx, sy - 6);

                // Kräftige, klare Temperatur-Anzeige direkt unterhalb (wie bei Windy: Geneva / 18°)
                cityCtx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
                cityCtx.fillStyle = '#111111';
                cityCtx.fillText(tempStr, sx, sy + 8);
                cityCtx.shadowColor = 'transparent';
            }
            cityCtx.restore();
        }

        // KAMERA FLUG (FLY-TO) FUNKTION
        function flyToLocation(targetLat, targetLng, targetName) {
            const localV = latLngToSphereVertex(targetLat, targetLng, 1.0);
            const targetUnit = new THREE.Vector3(-localV.z, localV.y, localV.x).normalize();
            const targetDist = 107.5; // Ideale Detailflughöhe für Relief & Straßen

            const startPos = camera.position.clone();
            const startUnit = startPos.clone().normalize();
            const startDist = startPos.length();

            cameraAnimation = {
                startTime: performance.now(),
                duration: 1300,
                startUnit,
                targetUnit,
                startDist,
                targetDist,
                targetLat,
                targetLng,
                targetName
            };
            controls.enabled = false;
        }

        // SUCHLEISTE LOGIK & EVENTS
        const searchInput = document.getElementById('searchInput');
        const searchClearBtn = document.getElementById('searchClearBtn');
        const searchSuggestions = document.getElementById('searchSuggestions');
        let activeSuggestionIndex = -1;
        let currentSuggestions = [];

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function updateSearchSuggestions() {
            const query = searchInput.value.trim().toLowerCase();
            if (!query) {
                searchSuggestions.style.display = 'none';
                searchSuggestions.innerHTML = '';
                searchClearBtn.style.display = 'none';
                currentSuggestions = [];
                activeSuggestionIndex = -1;
                return;
            }
            searchClearBtn.style.display = 'flex';

            const matches = [];
            for (let i = 0; i < citiesData.length; i++) {
                const c = citiesData[i];
                const nameLow = c.name.toLowerCase();
                const rawNameLow = (c.rawName || '').toLowerCase();
                if (nameLow.startsWith(query) || rawNameLow.startsWith(query)) {
                    matches.push({ city: c, priority: 2 });
                } else if (nameLow.includes(query) || rawNameLow.includes(query)) {
                    matches.push({ city: c, priority: 1 });
                }
                if (matches.length >= 35) break;
            }

            matches.sort((a, b) => {
                if (a.priority !== b.priority) return b.priority - a.priority;
                return a.city.scalerank - b.city.scalerank;
            });

            currentSuggestions = matches.slice(0, 6).map(m => m.city);
            activeSuggestionIndex = -1;
            renderSuggestionsHtml(query);
        }

        function renderSuggestionsHtml(query) {
            let html = '';
            if (currentSuggestions.length > 0) {
                currentSuggestions.forEach((city, idx) => {
                    const real = getInterpolatedData(city.lat, city.lng);
                    const tempStr = Math.round(real.t) + '°C';
                    const countryStr = city.country || '';
                    html += `
                        <div class="suggestion-item" data-idx="${idx}">
                            <div class="suggestion-main">
                                <div class="suggestion-name">${escapeHtml(city.name)}</div>
                                <div class="suggestion-sub">${escapeHtml(countryStr)}</div>
                            </div>
                            <div class="suggestion-temp">${tempStr}</div>
                        </div>
                    `;
                });
            }

            html += `
                <div class="suggestion-item suggestion-online" data-online="true">
                    <div class="suggestion-main">
                        <div class="suggestion-name" style="color: #00ccff;">🔍 Weltweit suchen nach "${escapeHtml(query)}"...</div>
                        <div class="suggestion-sub">OpenStreetMap-Suche für Berge, Täler & Orte</div>
                    </div>
                </div>
            `;

            searchSuggestions.innerHTML = html;
            searchSuggestions.style.display = 'block';

            searchSuggestions.querySelectorAll('.suggestion-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (el.dataset.online === 'true') {
                        searchOnline(query);
                    } else {
                        const idx = parseInt(el.dataset.idx);
                        selectCity(currentSuggestions[idx]);
                    }
                });
            });
        }

        function selectCity(city) {
            if (!city) return;
            searchInput.value = city.name;
            searchSuggestions.style.display = 'none';
            searchClearBtn.style.display = 'flex';
            flyToLocation(city.lat, city.lng, city.name);
            showLocationForecast(city.lat, city.lng, city.name, city.country);
        }

        function searchOnline(query) {
            searchSuggestions.innerHTML = '<div style="padding: 14px; color: #bbb; text-align: center; font-size: 13px;">Suche weltweit via OpenStreetMap...</div>';
            fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`)
                .then(r => r.json())
                .then(results => {
                    if (results && results.length > 0) {
                        const res = results[0];
                        const lat = parseFloat(res.lat);
                        const lng = parseFloat(res.lon);
                        const name = res.display_name.split(',')[0];
                        selectCity({ name, lat, lng });
                    } else {
                        searchSuggestions.innerHTML = '<div style="padding: 14px; color: #ff7777; text-align: center; font-size: 13px;">Kein Ort gefunden</div>';
                        setTimeout(() => { searchSuggestions.style.display = 'none'; }, 2200);
                    }
                })
                .catch(() => {
                    searchSuggestions.innerHTML = '<div style="padding: 14px; color: #ff7777; text-align: center; font-size: 13px;">Suche nicht erreichbar</div>';
                    setTimeout(() => { searchSuggestions.style.display = 'none'; }, 2200);
                });
        }

        searchInput.addEventListener('input', updateSearchSuggestions);
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim().length > 0) {
                updateSearchSuggestions();
            }
        });

        // Tastaturnavigation
        searchInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
            const items = searchSuggestions.querySelectorAll('.suggestion-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (items.length > 0) {
                    activeSuggestionIndex = (activeSuggestionIndex + 1) % items.length;
                    items.forEach((it, i) => it.classList.toggle('active', i === activeSuggestionIndex));
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (items.length > 0) {
                    activeSuggestionIndex = (activeSuggestionIndex - 1 + items.length) % items.length;
                    items.forEach((it, i) => it.classList.toggle('active', i === activeSuggestionIndex));
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
                    items[activeSuggestionIndex].click();
                } else if (currentSuggestions.length > 0) {
                    selectCity(currentSuggestions[0]);
                } else if (searchInput.value.trim().length > 0) {
                    searchOnline(searchInput.value.trim());
                }
            } else if (e.key === 'Escape') {
                searchSuggestions.style.display = 'none';
                searchInput.blur();
            }
        });

        searchInput.addEventListener('keyup', (e) => { e.stopPropagation(); });
        searchInput.addEventListener('keypress', (e) => { e.stopPropagation(); });

            e.stopPropagation();

        // CURSOR-BASIERTES ZOOMEN (Zoom to Mouse Position)
        const zoomRaycaster = new THREE.Raycaster();
        window.addEventListener('wheel', (event) => {
            if (cameraAnimation) return; // Nicht während automatischem Kameraflug
            if (event.target && typeof event.target.closest === 'function' && (
                event.target.closest('#search-container') || event.target.closest('#forecast-container') || 
                event.target.closest('#ui-container') || event.target.closest('#timeline-container'))) {
                return;
            }

            if (event.deltaY < 0) { // Nur beim Hineinzoomen den Cursor-Punkt anvisieren
                const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
                
                zoomRaycaster.setFromCamera({ x: mouseX, y: mouseY }, camera);
                const hits = zoomRaycaster.intersectObject(earthMesh);
                
                if (hits.length > 0) {
                    const hitPoint = hits[0].point;
                    const targetUnit = hitPoint.clone().normalize();
                    const camPos = camera.position;
                    const camUnit = camPos.clone().normalize();
                    const dist = camPos.length();
                    
                    // Sanfter Richtungsversatz zur Mausposition hin (für Mausrad und Präzisions-Touchpads)
                    const diff = targetUnit.clone().sub(camUnit);
                    const delta = Math.abs(event.deltaY);
                    const shiftAlpha = Math.min(0.25, Math.max(0.02, delta * 0.0012));
                    
                    const newCamUnit = camUnit.addScaledVector(diff, shiftAlpha).normalize();
                    camera.position.copy(newCamUnit.multiplyScalar(dist));
                    camera.lookAt(0, 0, 0);
                    controls.target.set(0, 0, 0);
                }
            }
        }, { capture: true, passive: true });

        // PROGNOSE-FUNKTIONEN (24h / 48h Wettertrend)
        function getTempAtStep(step, lat, lng) {
            if (!step || !step.data) return 15;
            const th = step.header;
            let lon0360 = lng < 0 ? lng + 360 : lng;
            let y = (th.la1 - lat) / th.dy;
            let x = lon0360 / th.dx;
            let y0 = Math.floor(y); let x0 = Math.floor(x);
            let y1 = y0 + 1; let x1 = x0 + 1;
            if (y0 < 0) y0 = 0; if (y0 >= th.ny) y0 = th.ny - 1;
            if (y1 < 0) y1 = 0; if (y1 >= th.ny) y1 = th.ny - 1;
            if (x0 < 0) x0 = 0; if (x0 >= th.nx) x0 = th.nx - 1;
            if (x1 < 0) x1 = 0; if (x1 >= th.nx) x1 = th.nx - 1;
            let dy = y - y0; let dx = x - x0;
            const i00 = y0 * th.nx + x0; const i10 = y0 * th.nx + x1;
            const i01 = y1 * th.nx + x0; const i11 = y1 * th.nx + x1;
            const scale = step.scale || 1.0;
            const d = step.data;
            const t00 = d[i00] * scale;
            const t10 = d[i10] * scale;
            const t01 = d[i01] * scale;
            const t11 = d[i11] * scale;
            return t00*(1-dx)*(1-dy) + t10*dx*(1-dy) + t01*(1-dx)*dy + t11*dx*dy;
        }
